    </div>
    <div class="row">
      <button class="btn fog sm" id="chrono-start" data-act="chronoStart">Lancer</button>
      <button class="btn sm" data-act="chronoPause">Pause</button>
      <button class="btn ghost sm" data-act="chronoReset">Remettre à zéro</button>
    </div>
    <div class="row">
      <button class="btn lamp sm" data-act="chaseWin" data-n="${n}">Réussi</button>
      ${fails>=1
        ? `<button class="btn sm" data-act="chaseRefuge" data-n="${n}">Deuxième échec : ils se réfugient</button>`
        : `<button class="btn sm" data-act="chaseFail" data-n="${n}">Raté : on recommence</button>`}
    </div>
    <span class="muted" style="font-size:.78rem">Le mini-jeu exact reste à choisir. On ne peut pas perdre : au deuxième échec, le groupe se réfugie quelque part malgré tout.</span>
  </div>`;
}

function renderPhase(){
  const p=P(), el=$("phase");
  let body="";
  if(p.id==="j1"||p.id==="j2"){
    const c=S.crans, max=p.crans;
    const ev = p.id==="j1" ? [
      [max,"Début","Le voisin à la porte du Hall (J1, A1) : quelque chose rôde la nuit, il réparera le van. « Si on savait par où ça entre… »"],
      [1,"1 cran","L'horloge sonne 21h, le soleil va bientôt se coucher."],
      [0,"0 cran","Actions gratuites de la pièce seulement, puis la nuit tombe : Nuit 2."]
    ] : [
      [max,"Début","Le voisin revient (J2). L'équipe lui raconte la nuit et le plan de Fred. Il parle des lianes de la serre."],
      [1,"1 cran","« Dernière chance ! » Dernier moment pour les capacités. Liane apportée si besoin."],
      [0,"0 cran","Actions gratuites de la pièce seulement, puis la nuit tombe : Nuit 3."]
    ];
    body = `
      <div class="panel-head"><h2>${p.label}</h2><span class="eyebrow">Objectif</span></div>
      <p style="margin:0">${p.id==="j1"?"Découvrir d'où vient l'Ombre.":"Trouver la liane et finir de trouver où la tendre."}</p>
      ${scriptList(codesFrom(p.id==="j1"?"J1":"J2"))}
      <ul class="timeline">${ev.map(([at,w,t])=>{
        const st = c<at ? "past" : c===at ? "now" : "";
        return `<li class="${st}"><span class="when">${w}</span><span>${esc(t)}</span></li>`;
      }).join("")}</ul>
      ${scriptList(["JR"])}`;
  } else if(p.id==="n1"){
    body = `<div class="panel-head"><h2>Nuit 1 : l'arrivée</h2><span class="eyebrow">Racontée</span></div>
      <span class="muted" style="font-size:.85rem">Aucune action, aucun indice sur le chemin de l'Ombre.</span>
      ${scriptList(codesFrom("N1-"))}
      <div class="row"><button class="btn lamp" data-act="next">Le jour se lève : Jour 1</button></div>`;
  } else if(p.id==="n2"){
    const codes=codesFrom("N2-"), at=codes.indexOf("N2-3")+1 || codes.length;
    body = `<div class="panel-head"><h2>Nuit 2 : la première apparition</h2><span class="eyebrow">Salon</span></div>
      ${scriptList([...codes.slice(0,at), chronoBlock("n2"), ...codes.slice(at)])}
      <div class="row"><button class="btn lamp" data-act="next">Le jour se lève : Jour 2</button></div>`;
  } else if(p.id==="n3"){
    const pl=S.liane.placed;
    let res=`<div class="alert night"><b>« Où tendez-vous la liane ? »</b><span>Touchez la pièce choisie.</span>${S.liane.found?"":`<span class="muted">Attention : le journal dit que le groupe n'a pas encore la liane.</span>`}</div>`;
    if(pl==="E") res=`<div class="alert"><b>Bon endroit : la Chambre.</b><span>L'Ombre sort du conduit et trébuche dans la liane : capturée directement.</span></div>`;
    else if(pl) res=`<div class="alert warn"><b>Mauvais endroit : ${ROOMS[pl].name}.</b><span>Elle enjambe la liane si elle la croise et trouve le groupe. Course-poursuite, puis les joueurs l'attirent vers la liane : capturée.</span></div>`;
    res+=`<div class="go-row">${roomChips()}</div>`;
    const after = pl==="E" ? ["N3-2A"] : pl ? ["N3-2B", chronoBlock("n3"), "N3-3B"] : [];
    body = `<div class="panel-head"><h2>Nuit 3 : le piège</h2><span class="eyebrow">Le final</span></div>
      ${res}${scriptList(["N3-1", ...after])}
      <div class="row"><button class="btn lamp" data-act="next" ${pl?"":"disabled"}>Démasquer l'Ombre</button></div>`;
  } else {
    const used=CAPS.filter(c=>S.caps[c.k].used).length;
    const seen=Object.keys(ROOMS).filter(r=>S.visited[r]).length;
    body = `<div class="panel-head"><h2>Fin : le démasquage</h2><span class="eyebrow">Épilogue</span></div>
      ${scriptList(codesFrom("N4-"))}
      <dl class="kv">
        <dt>Pièces visitées</dt><dd>${seen} sur 7${S.hidden?", plus la pièce cachée":""}</dd>
        <dt>Capacités utilisées</dt><dd>${used} sur 6 (état final)</dd>
        <dt>Liane</dt><dd>${S.liane.placed?`tendue dans ${ROOMS[S.liane.placed].name}`:"pas tendue"}</dd>
      </dl>`;
  }
  el.innerHTML=body;
}

/* Les pièces en boutons courts : se déplacer (le jour) ou tendre la liane (nuit 3) sans déplier le manoir. */
function roomChips(){
  const n3=P().id==="n3";
  return Object.keys(ROOMS).filter(r=>n3 || r!==S.room).map(r=>{
    let meta="", cls="";
    if(n3){ if(S.liane.placed===r){ meta="liane ici"; cls="on"; } }
    else if(!accessible(r)){ meta="fermée"; cls="locked"; }
    else { const c=cost(S.room,r); meta = c===0 || S.joker==="move" ? "gratuit" : `${c} cran${c>1?"s":""}`; }
    return `<button class="go ${cls}" data-act="room" data-r="${r}"><b>${r}</b>${ROOMS[r].name}${meta?`<small>${meta}</small>`:""}</button>`;
  }).join("");
}
function renderPlan(){
  const el=$("plan"), n3=P().id==="n3", day=isDay();
  const tile=(r)=>{
    const R=ROOMS[r], here=S.room===r && !n3 && P().id!=="fin", vis=!!S.visited[r];
    const locked=!accessible(r);
    let meta="";
    if(n3){ meta = S.liane.placed===r ? "liane tendue" : "tendre ici"; }
    else if(here) meta="le groupe est ici";
    else if(locked) meta="fermée à clé";
    else if(day){ const c=cost(S.room,r); meta = c===0 ? "gratuit" : S.joker==="move" ? "gratuit (Daphné)" : `${c} cran${c>1?"s":""}`; }
    else meta = vis ? "tuile posée" : "pas visitée";
    const cls=["tile", vis?"visited":"", here?"here":"", locked&&!n3?"locked":"", n3&&S.liane.placed===r?"trap":""].join(" ");
    const dis = n3 ? false : !day;
    return `<button class="${cls}" data-act="room" data-r="${r}" ${dis?"disabled":""} aria-label="${R.name}, ${meta}">
      ${R.chem?'<span class="chem" title="Cheminée"></span>':""}
      <span class="letter">${r}</span><span class="nm">${R.name}</span>
      ${r==="B"&&S.hidden?'<span class="hidden-room">+ pièce cachée</span>':""}
      <span class="meta">${meta}</span>
    </button>`;
  };
  const moveCap = capOk("elegante") && !S.joker
    ? `<div class="act cap"><span class="t"><span class="by">${esc(who("elegante"))}</span>Le prochain déplacement est gratuit</span><span class="btns"><button class="btn fog sm" data-act="cap" data-k="elegante" data-o="move">Un jeu d'enfant !</button></span></div>` : "";
  $("plan-sum").innerHTML = `<h2>Le manoir</h2><span class="eyebrow">${n3 ? (S.liane.placed?`Liane : ${ROOMS[S.liane.placed].name}`:"Où tendre la liane ?") : day ? `Groupe : ${ROOMS[S.room].name}` : "Déplacements le jour seulement"}</span>`;
  el.innerHTML = `
    ${moveCap}
    <div class="plan" role="group" aria-label="Plan du manoir">
      <span class="lvl">Étage 1</span>
      <span class="sealed" title="Pièces condamnées"></span><span class="sealed"></span><span class="sealed"></span>${tile("E")}<span class="sealed"></span>
      <span class="lvl">RdC</span>
      ${tile("F")}${tile("B")}${tile("A")}${tile("C")}${tile("D")}
      <span class="lvl">−1</span>
      <span class="void"></span><span class="void"></span>${tile("H")}
      <div class="tile lab" aria-label="Laboratoire, épilogue"><span class="letter">Lab</span><span class="nm">Laboratoire</span><span class="meta">épilogue</span></div>
      <span class="void"></span>
    </div>
    <div class="legend">
      <span><i style="border-style:dashed"></i>pas visitée</span>
      <span><i style="background:var(--panel-2)"></i>tuile posée</span>
      <span><i style="border-color:var(--lamp)"></i>le groupe</span>
      <span><i style="background:repeating-linear-gradient(-45deg,var(--panel) 0 3px,var(--panel-2) 3px 4px)"></i>condamnée</span>
    </div>`;
}

function renderRoom(){
  const el=$("room");
  if(!isDay()){
    el.innerHTML = `<div class="panel-head"><h2>${P().id==="fin"?"Le Laboratoire":"Le Salon"}</h2><span class="eyebrow">La nuit</span></div>
      <p class="muted" style="margin:0">${P().id==="fin"?"On descend libérer Georges.":"Le groupe dort au Salon. Les pièces s'explorent le jour."}</p>`;
    return;
  }
  const r=S.room, d=dayNum();
  const flairOk = capOk("flaireur"), elegOk = capOk("elegante") && !S.joker;
  const note = t => `<span class="muted" style="font-size:.8rem">${t}</span>`;
  const capRow = (k, t, res, btns) => `<div class="act cap"><span class="t"><span class="by">${esc(who(k))}</span>${esc(t)}</span><span class="btns">${btns}</span><span class="r">${esc(res)}</span></div>`;
  const capBtn = (k, label, o) => `<button class="btn fog sm" data-act="cap" data-k="${k}"${o?` data-o="${o}"`:""}>${label}</button>`;
  const spent = k => `capacité de ${CAPNAME[k]} déjà utilisée${capOk("meneur")?" (Fred peut la lui rendre)":""}`;
  const roomCaps = [];
  if(capOk("enquetrice")) roomCaps.push(capRow("enquetrice", `Œil de lynx sur ${ROOMS[r].name}`, loupeRes(r), capBtn("enquetrice","Utiliser")));
  if(capOk("meneur")){
    const targets=CAPS.filter(x=>x.k!=="meneur" && S.caps[x.k].used);
    if(targets.length) roomCaps.push(capRow("meneur", "« Les amis, j'ai un plan ! »", "Rend son usage à une capacité déjà utilisée.", targets.map(x=>capBtn("meneur",`Rendre à ${x.role}`,x.k)).join("")));
  }
  const doneRow = (t, res, sub) => `<div class="act done"><span class="t">${t}</span><span class="btns">${sub?readBtn(sub, `Lire ${sub}`):""}<span class="cost free">fait</span></span><span class="r">${res}</span></div>`;
  const els = ELEMENTS[r].map(([code,name])=>{
    const key = (code==="A1" && d===2 && BOOK.has("A1b")) ? "A1b" : code;
    // Les actions d'un script qui suit l'élément (C1b, le journal) sont rangées sous lui.
    const acts = ACTIONS.filter(a=>(a.el===code || a.el===code+"b") && (!a.day || a.day===d) && (!a.needKey || S.done[a.id] || (S.key && !S.unlocked.H)));
    const extra = [];
    if(code==="B1"){ extra.push(S.gave.z1 ? doneRow("Scooby-Snack donné à Pazu", "→ B1b : la pièce cachée, fait 1, fumigènes", "B1b")
      : capOk("gourmand") ? capRow("gourmand", "Lui donner un Scooby-Snack", "→ B1b : la pièce cachée, fait 1, fumigènes", capBtn("gourmand","Donner un Scooby-Snack","z1"))
      : note(`Scooby-Snack à Pazu : ${spent("gourmand")}. Recharge : le Scooby-Snack de la Cuisine (F1).`)); }
    if(code==="C1" && !S.done.c1p){ extra.push(S.gave.z2 ? doneRow("Scooby-Snack donné à Amaya", "→ C1b : elle laisse le journal", "C1b")
      : capOk("gourmand") ? capRow("gourmand", "Lui donner un Scooby-Snack", "→ C1b : elle laisse le journal", capBtn("gourmand","Donner un Scooby-Snack","z2"))
      : note(`Scooby-Snack à Amaya : ${spent("gourmand")}. Sinon : la prendre dans les bras (1 cran).`)); }
    if(code==="B4" && !S.unlocked.F) extra.push(capOk("costaud") ? capRow("costaud", "Forcer la porte", "La porte cède : accès à la Cuisine (F)", capBtn("costaud","Puppy Power !","F"))
      : note(`Fermée à clé : ${spent("costaud")}.`));
    if(code==="A2" && !S.unlocked.H) extra.push(capOk("costaud") ? capRow("costaud", "Forcer la porte", "La porte cède : accès au sous-sol (H)", capBtn("costaud","Puppy Power !","H"))
      : note(`Fermée à clé : ${S.key?"le groupe a le double de la clé.":`double de la clé (D2), ${spent("costaud")}.`}`));
    if(code==="A2" && S.unlocked.H) extra.push(`<span class="chip ok" style="align-self:flex-start">Cave ouverte</span>`);
    if(code==="B4" && S.unlocked.F) extra.push(`<span class="chip ok" style="align-self:flex-start">Cuisine ouverte</span>`);
    if(code==="H3") extra.push(note("Bloquée. Teaser de Georges."));
    const rows = acts.map(a=>{
      const done=!!S.done[a.id], free=!a.cost || S.joker==="action", locked=!done && a.lock && a.lock();
      return `<div class="act ${done?"done":""}">
        <span class="t">${a.el!==code?`<span class="by">${a.el}</span>`:""}${esc(a.t)}</span>
        <span class="btns">
          ${done ? `${a.sub?readBtn(a.sub, `Lire ${a.sub}`):""}<span class="cost free">fait</span>` : locked ? note(locked) : `
            ${a.cost && flairOk ? `<button class="btn fog sm" data-act="sniff" data-id="${a.id}" title="Capacité de Scooby">Renifler</button>`:""}
            ${a.cost && elegOk ? `<button class="btn fog sm" data-act="act" data-id="${a.id}" data-eleg="1" title="Capacité de Daphné : action payante gratuite">Daphné : gratuit</button>`:""}
            <button class="btn ${a.cost?"lamp":""} sm" data-act="act" data-id="${a.id}" ${a.cost&&S.crans===0?"disabled":""}>${a.cost?(free?"Faire (gratuit)":"Faire · 1 cran"):"Noter"}</button>`}
        </span>
        <span class="r">${esc(a.r)}</span>
      </div>`;
    }).join("");
    return `<div class="el"><div class="el-head"><span class="chip lamp">${key}</span><b>${esc(name)}</b>${readBtn(key, "Lire")}</div>${rows}${extra.join("")}</div>`;
  }).join("");
  el.innerHTML = `
    <div class="panel-head"><h2>${ROOMS[r].name}</h2>${readBtn(r, `Entrée ${r}`)}</div>
    <div class="go-row"><span class="eyebrow">Aller vers</span>${roomChips()}</div>
    ${roomCaps.length?`<div class="room-caps">${roomCaps.join("")}</div>`:""}
    <span class="muted" style="font-size:.8rem">Seules les actions qui comptent sont listées. 📖 ouvre le script de l'élément dans le livret.</span>
    <div class="elements">${els}</div>`;
}

function renderCaps(){
  const r=S.room;
  const targets=CAPS.filter(x=>x.k!=="meneur" && S.caps[x.k].used);
  const paidHere=ACTIONS.some(a=>a.cost && !S.done[a.id] && a.el[0]===r);
  const usableHere={
    meneur: targets.length>0,
    elegante: !S.joker,
    enquetrice: true,
    gourmand: (r==="B" && !S.gave.z1) || (r==="C" && !journalFree()),
    flaireur: paidHere,
    costaud: (r==="B" && !S.unlocked.F) || (r==="A" && !S.unlocked.H)
  };
  const where={
    meneur: targets.length ? "Bouton en haut de la pièce." : "Aucune autre capacité utilisée pour l'instant.",
    elegante: "Boutons sur le plan (déplacement) et sur chaque action payante.",
    enquetrice: "Bouton en haut de la pièce.",
    gourmand: "Bouton sur Pazu (B1, Salon) et Amaya (C1, Bibliothèque).",
    flaireur: "Bouton « Renifler » sur les actions payantes de la pièce.",
    costaud: "Bouton sur la porte de la Cuisine (B4, Salon) et de la cave (A2, Hall)."
  };
  const cards = CAPS.map(c=>{
    const used=S.caps[c.k].used, here=!used && capOk(c.k) && usableHere[c.k];
    let btns="";
    if(!used){
      btns=`<span class="muted" style="font-size:.8rem">${where[c.k]}</span>`;
    } else {
      if(c.k==="gourmand") btns=`<span class="muted" style="font-size:.8rem">${S.snack ? "Le groupe a le jeton Scooby-Snack : il s'utilise comme la capacité." : S.box ? "" : "Rechargeable avec le Scooby-Snack de la Cuisine (F1)."}</span>`;
      if(c.k==="enquetrice" && S.loupe) btns=`<span class="muted" style="font-size:.8rem">${ROOMS[S.loupe.room].name} : ${esc(S.loupe.res)}</span>`;
    }
    return `<div class="capc ${used?"used":""}">
      <div class="h">
        <span class="who"><span class="role">${c.role}</span><input id="name-${c.k}" data-name="${c.k}" value="${esc(S.names[c.k]||"")}" placeholder="joueur" aria-label="Joueur qui incarne ${c.role}"></span>
        <span class="pill ${used?"off":here?"here":"on"}">${used?"Utilisée":here?"Utilisable ici":"Disponible"}</span>
      </div>
      <span class="q">${c.q}</span>
      ${used?"":`<span class="rule">${c.rule}</span>`}
      ${btns?`<div class="row">${btns}</div>`:""}
    </div>`;
  }).join("");
  const left=CAPS.filter(c=>!S.caps[c.k].used).length;
  $("caps-sum").innerHTML = `<h2>Capacités</h2><span class="eyebrow">${left} sur 6 disponibles</span>`;
  $("caps").innerHTML = `
    <span class="muted" style="font-size:.8rem">Une seule fois dans toute la partie, à tout moment de la journée. Elles se cumulent.</span>
    <div class="caps">${cards}</div>`;
}

function renderInquiry(){
  const srcLabel={B1b:"B1b pièce cachée",C1b:"C1b journal",H1:"H1 plan technique",Loupe:"Loupe",A3:"A3 Hall",C4:"C4 Biblio.",E2:"E2 Chambre",C2b:"C2b monte-charge"};
  const facts=[1,2,3].map(n=>{
    const got=S.facts[n].length>0;
    const part = n===1 && !got && S.hints1.length>0;
    const srcs = S.facts[n].map(s=>`<span class="chip ok">${srcLabel[s]||s}</span>`).join("")
      + (n===1 ? S.hints1.map(s=>`<span class="chip lamp">${s==="Nuit 2"?"raclement, nuit 2":srcLabel[s]||s}</span>`).join("") : "");
    const status = got ? "Trouvé" : part ? "À déduire" : "Pas encore";
    return `<div class="fact ${got?"got":part?"part":""}">
      <span class="n">${n}</span>
      <div class="txt"><b>${FACTS[n].t}</b> <span class="muted">· ${status}</span><br><span class="muted" style="font-size:.8rem">${FACTS[n].elim}</span>
      ${srcs?`<div class="srcs">${srcs}</div>`:""}</div>
    </div>`;
  }).join("");
  const all = [1,2,3].every(n=>S.facts[n].length || (n===1 && S.hints1.length));
  const lianeTxt = S.liane.found==="D1" ? "Trouvée (D1, les Sylvains)" : S.liane.found==="Habitants" ? "Apportée à « Dernière chance ! »" : "Pas encore";
  const found=[1,2,3].filter(n=>S.facts[n].length).length;
  $("inquiry-sum").innerHTML = `<h2>L'enquête</h2><span class="eyebrow">${found} fait${found>1?"s":""} sur 3 · liane ${S.liane.found?"trouvée":"pas encore"}</span>`;
  $("inquiry").innerHTML = `
    <div class="facts">${facts}</div>
    ${all?`<div class="alert"><b>Les joueurs ont de quoi déduire la Chambre.</b><span class="muted">Fait 1, puis 2, puis 3 : il ne reste que la Chambre.</span></div>`:""}
    ${S.loupe&&S.loupe.room==="E"?`<span class="chip fog" style="align-self:flex-start">Bonus : la loupe confirme la Chambre</span>`:""}
    <dl class="kv">
      <dt>La liane</dt><dd><b style="color:${S.liane.found?"var(--ok)":"var(--ink)"}">${lianeTxt}</b>${S.liane.placed?` · tendue dans ${ROOMS[S.liane.placed].name}`:""}</dd>
      <dt>Double de la clé</dt><dd>${S.key?"Trouvé (D2)":"Pas trouvé"}</dd>
      <dt>Scooby-Snack de la Cuisine</dt><dd>${S.snack?"Jeton au groupe (F1)":S.box?"Pris (F1)":"Dans la Cuisine"}</dd>
      <dt>Portes</dt><dd>Cuisine ${S.unlocked.F?"ouverte":"fermée"} · Cave ${S.unlocked.H?"ouverte":"fermée"}</dd>
    </dl>`;
}

function renderJournal(){
  $("journal").innerHTML = `
    <div class="panel-head"><h2>Journal</h2><span class="eyebrow">${S.log.length} entrée${S.log.length>1?"s":""}</span></div>
    ${S.log.length ? `<ul class="log">${S.log.map(l=>`<li><span class="w">${l.p}${l.c!==null?` · ${l.c}`:""}</span><span>${esc(l.t)}</span></li>`).join("")}</ul>`
      : `<p class="muted" style="margin:0">Chaque déplacement, action et capacité s'inscrit ici. « Annuler » (ou Ctrl+Z) revient en arrière.</p>`}`;
}

loadBook();
loadMedia();
if(getLink()) loadFromLink(getLink(), true);
if(!S.log.length) log("Nuit 1 commence. Le groupe dort au Salon.");
render();
})();
</script>

</body></html>
