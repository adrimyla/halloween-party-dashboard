<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matériel à imprimer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Caveat:wght@400;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* Le matériel posé sur la table, en plus du plan : cartes personnage, jetons, documents à remettre, aide de jeu.
   Tout est en millimètres : imprimé à 100 %, les jetons entrent pile dans les cases de la piste du sablier. */
:root{
  --paper:#f4efe4; --sheet:#fffdf8; --ink:#1f1b24; --muted:#6b6470; --line:#d9d0c0;
  --tile:#f7ecd6; --wood:#c9a882; --leaf:#8db66a; --vine:#4f6b33; --snack:#e8d38f;
  --red:#b3261e; --blue:#2c4a7a; --aged:#efe2c4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header h1{font:400 2.4rem/1.1 "IM Fell English SC",Georgia,serif;margin:0}
header p{margin:.3rem 0 0;color:var(--muted)}

.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:16px 0 8px;padding:10px 12px;background:var(--sheet);border:1px solid var(--line);border-radius:10px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{font:inherit;border:0;background:transparent;color:var(--ink);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.bar .print{margin-left:auto;font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--ink);background:var(--sheet);cursor:pointer}
.hint{color:var(--muted);font-size:.85rem;margin:0 0 10px}
.todo{font-size:.85rem;background:#fff6dc;border:1px solid #e9d49a;border-radius:8px;padding:8px 12px;margin:0 0 14px}
.todo ul{margin:.2rem 0 0;padding-left:1.2rem}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:22px;overflow-x:auto}
.sheet h2{margin:0 0 8px;font:400 1.6rem/1 "IM Fell English SC",Georgia,serif}
.sheet h3{margin:6mm 0 3mm;font:400 1.15rem/1 "IM Fell English SC",Georgia,serif}
.cut{display:flex;flex-wrap:wrap;gap:5mm;align-items:flex-start}
.cut figure{margin:0;width:min-content;break-inside:avoid}
.cut figcaption{font-size:.72rem;color:var(--muted);margin-top:1.5mm;max-width:100%}
.cut figcaption b{color:var(--ink)}

/* ---------- Cartes personnage (63 × 88 mm, format carte à jouer) ---------- */
.cards{display:grid;grid-template-columns:repeat(3,63mm);gap:2mm;justify-content:center}
.card{width:63mm;height:88mm;border:.3mm solid #b9ae9c;border-radius:3mm;padding:2.5mm;background:var(--sheet)}
.card .in{height:100%;border:.5mm solid var(--ink);border-radius:2mm;outline:.25mm solid var(--ink);outline-offset:-1.3mm;
  padding:3mm 3.5mm;display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--tile)}
.card .name{font:400 19pt/1 "IM Fell English SC",Georgia,serif;margin-top:.5mm}
.card svg{width:21mm;height:21mm;margin:2mm 0 1.5mm}
.card .q{font:italic 11.5pt/1.15 "IM Fell English",Georgia,serif;margin:0 0 2mm}
.card .rule{font-size:8.3pt;line-height:1.3;margin:0}
.card .foot{margin-top:auto;font:italic 7.5pt/1.2 "IM Fell English",Georgia,serif;color:var(--muted);border-top:.25mm solid #b9ae9c;padding-top:1.5mm;width:100%}
.card.back .in{justify-content:center;background:repeating-linear-gradient(45deg,#ece5d8 0 2.2mm,#d8cdb9 2.2mm 3.2mm)}
.card.back .name{background:var(--sheet);padding:2mm 4mm;border:.4mm solid var(--ink);border-radius:2mm}
.card.back .used{margin-top:3mm;background:var(--sheet);padding:1mm 3mm;border-radius:1.5mm;font:italic 11pt "IM Fell English",Georgia,serif}

/* ---------- Jetons ---------- */
.token{display:block;width:28mm;height:28mm}
.token.big{width:36mm;height:36mm}
.tk-edge{fill:var(--tile);stroke:var(--ink);stroke-width:1.6}
.tk-ring{fill:none;stroke:var(--ink);stroke-width:.6}
.tk-t{font:400 10px "IM Fell English SC",Georgia,serif;fill:var(--ink);text-anchor:middle}
.letters{display:flex;flex-wrap:wrap;gap:2mm}
.letter{position:relative;width:16mm;height:16mm;background:#f0dfb0;border:.3mm solid #8c7a55;border-radius:1.5mm;
  display:grid;place-items:center;font:700 22pt/1 Georgia,serif;color:var(--ink)}
.letter small{position:absolute;right:1.2mm;bottom:.6mm;font:700 6.5pt system-ui,sans-serif}

/* ---------- Documents à remettre ---------- */
.doc{position:relative;color:var(--ink);box-shadow:0 0 0 .3mm #b9ae9c}
.hand{font-family:"Caveat",cursive}
.type{font-family:"Special Elite","Courier New",monospace}

.d-note{width:120mm;padding:7mm 9mm 6mm;font-size:17pt;line-height:8mm;
  background:#fffdf3 repeating-linear-gradient(to bottom,transparent 0 7.6mm,#a9c3e0 7.6mm 8mm) 0 6.6mm}
.d-note p{margin:0}
.d-note .sig{text-align:right;margin-top:2mm}

.d-type{width:94mm;min-height:118mm;padding:7mm 7mm 8mm;background:#fbfaf6;font-size:8.6pt;line-height:1.45}
.d-type .head{text-align:center;border-bottom:.5mm double var(--ink);padding-bottom:2.5mm;margin-bottom:3mm}
.d-type .head b{display:block;font:400 13pt/1.1 "IM Fell English SC",Georgia,serif;letter-spacing:.04em}
.d-type .head span{font-size:7pt;color:var(--muted)}
.d-type h4{margin:0 0 2.5mm;font:inherit;font-size:11pt;text-align:center;letter-spacing:.12em}
.d-type p{margin:0 0 2mm}
.d-type table{width:100%;border-collapse:collapse;margin:2mm 0 3mm}
.d-type td{padding:1.2mm 0;border-bottom:.2mm dotted #8f8679;vertical-align:top}
.d-type td:last-child{text-align:right;white-space:nowrap;padding-left:3mm}
.d-type .stamp{position:absolute;right:8mm;bottom:12mm;transform:rotate(-12deg);border:.6mm solid var(--blue);color:var(--blue);
  padding:1mm 3mm;font-size:9pt;letter-spacing:.1em;opacity:.8}

.d-journal{width:94mm;min-height:90mm;padding:8mm 8mm 8mm 13mm;font-size:15.5pt;line-height:1.15;
  background:var(--aged) linear-gradient(to right,transparent 9mm,#d8a9a0 9mm 9.4mm,transparent 9.4mm)}
.d-journal .date{font-size:13pt;text-decoration:underline;margin:0 0 2mm}
.d-journal p{margin:0 0 3mm}
.d-journal .other{opacity:.75}

.d-torn{width:94mm;padding:12mm 9mm 7mm 13mm;font-size:16.5pt;line-height:1.15;
  background:var(--aged) linear-gradient(to right,transparent 9mm,#d8a9a0 9mm 9.4mm,transparent 9.4mm);
  clip-path:polygon(0 9%,6% 3%,11% 8%,17% 1%,24% 7%,30% 2%,37% 9%,44% 3%,50% 8%,57% 0,63% 6%,70% 2%,77% 9%,83% 3%,90% 7%,95% 1%,100% 6%,100% 100%,0 100%);
  box-shadow:none;filter:drop-shadow(0 0 .25mm #8f8679)}
.d-torn p{margin:0}

.d-blue{width:165mm;background:#f2f6fa}
.d-blue svg,.d-tech svg{display:block;width:100%;height:auto}
.bl{fill:none;stroke:var(--blue);stroke-width:1.4}
.bl-thin{fill:none;stroke:var(--blue);stroke-width:.7}
.bl-fill{fill:#dbe5f0;stroke:var(--blue);stroke-width:1.4}
.bl-t{font:400 10px "Special Elite","Courier New",monospace;fill:var(--blue)}
.bl-h{font:400 13px "IM Fell English SC",Georgia,serif;fill:var(--blue)}
.madame{font:italic 15px "IM Fell English",Georgia,serif;fill:#3a2a4a}

.d-tech{width:160mm;background:#fbfaf6}
.tc-room{fill:#fffdf8;stroke:var(--ink);stroke-width:2.5}
.tc-sealed{fill:#ece5d8;stroke:var(--ink);stroke-width:2.5}
.tc-wire{fill:none;stroke:#5a5560;stroke-width:1.6;stroke-dasharray:7 4}
.tc-lamp{fill:#fffdf8;stroke:#5a5560;stroke-width:1.4}
.tc-chem{fill:#6d625a;stroke:var(--ink);stroke-width:1.5}
.tc-name{font:400 17px "IM Fell English",Georgia,serif;fill:var(--ink);text-anchor:middle}
.tc-red{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round}
.tc-note{font:600 21px "Caveat",cursive;fill:var(--red)}
.tc-title{font:400 15px "Special Elite","Courier New",monospace;fill:var(--ink)}

.d-cat{width:94mm;padding:6mm 7mm;background:#fdfcf8;font-size:8.3pt;line-height:1.35}
.d-cat .head{background:var(--ink);color:var(--sheet);margin:-6mm -7mm 4mm;padding:4mm 7mm 3mm}
.d-cat .head b{display:block;font:400 14pt/1 "IM Fell English SC",Georgia,serif}
.d-cat .item{display:grid;grid-template-columns:22mm 1fr;gap:3mm;padding:2.5mm 0;border-bottom:.2mm solid var(--line)}
.d-cat .item svg{width:22mm;height:18mm;background:#f2ede2;border-radius:1mm}
.d-cat .item b{font-size:9.5pt}
.d-cat .price{font-weight:700}
.d-cat .circled{position:relative}
.d-cat .circled::after{content:"";position:absolute;inset:-1mm -2mm;border:.6mm solid var(--red);border-radius:50%;transform:rotate(-2deg)}
.d-cat::after{content:"";position:absolute;right:0;top:0;width:14mm;height:14mm;background:linear-gradient(225deg,var(--paper) 50%,#e3dccd 50%);box-shadow:-.4mm .4mm .8mm #0002}

.d-grim{width:94mm;padding:8mm 9mm;background:#f3e7cc;font:10pt/1.4 "IM Fell English",Georgia,serif}
.d-grim .run{text-align:center;font:italic 8pt "IM Fell English",Georgia,serif;color:var(--muted);margin-bottom:4mm}
.d-grim h4{font:400 14pt/1.1 "IM Fell English SC",Georgia,serif;text-align:center;margin:0 0 4mm}
.d-grim p{margin:0 0 3mm;text-align:justify;hyphens:auto}
.d-grim p:first-of-type::first-letter{float:left;font-size:30pt;line-height:.85;margin:1mm 1.5mm 0 0}
.d-grim .margin{font:600 15pt/1.1 "Caveat",cursive;color:#3a2a4a;transform:rotate(-3deg);margin:4mm 0 0;padding:2mm 3mm;border-left:.6mm solid #3a2a4a}
.d-grim::after{content:"";position:absolute;right:0;top:0;width:12mm;height:12mm;background:linear-gradient(225deg,var(--paper) 50%,#ddcfae 50%)}

.d-napkin{width:68mm;height:68mm;display:grid;place-items:center;background:#fff;
  box-shadow:0 0 0 .3mm #b9ae9c,inset 0 0 0 3mm #fff,inset 0 0 0 3.4mm #e3dccd}
.d-napkin p{margin:0;font:600 20pt/1 "Caveat",cursive;transform:rotate(-6deg)}

/* ---------- Aide de jeu ---------- */
.track{display:block;width:190mm;height:auto}
.tr-board{fill:var(--tile);stroke:var(--ink);stroke-width:1.4}
/* La piste est dessinée en millimètres : 1px du viewBox = 1 mm imprimé. */
.tr-board{stroke-width:.4}
.tr-slot{fill:var(--sheet);stroke:var(--ink);stroke-width:.35;stroke-dasharray:1.5 1}
.tr-slot.j2{fill:#ece5d8}
.tr-n{font:400 9px "IM Fell English",Georgia,serif;fill:#b9ae9c;text-anchor:middle;dominant-baseline:central}
.tr-l{font:600 3.2px system-ui,sans-serif;fill:var(--ink);text-anchor:middle}
.tr-s{font:italic 3.6px "IM Fell English",Georgia,serif;fill:var(--muted);text-anchor:middle}
.tr-h{font:400 6.5px "IM Fell English SC",Georgia,serif;fill:var(--ink)}
.aid{width:190mm;border:.5mm solid var(--ink);border-radius:3mm;background:var(--tile);padding:6mm 7mm;margin-top:6mm;font-size:10pt;line-height:1.4}
.aid h4{margin:0 0 3mm;font:400 17pt/1 "IM Fell English SC",Georgia,serif;text-align:center}
.aid .cols{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.aid h5{margin:0 0 1.5mm;font:400 12.5pt "IM Fell English SC",Georgia,serif;border-bottom:.3mm solid var(--ink)}
.aid ul,.aid ol{margin:0 0 3mm;padding-left:5mm}
.aid li{margin-bottom:.8mm}
.aid .code{display:inline-grid;place-items:center;min-width:7mm;height:5mm;padding:0 1.2mm;border-radius:2.5mm;background:var(--ink);color:var(--sheet);font:700 7.5pt/1 system-ui,sans-serif}

/* Les quatre vues */
.view{display:none}
body[data-view="cards"] .v-cards, body[data-view="tokens"] .v-tokens, body[data-view="docs"] .v-docs, body[data-view="aid"] .v-aid{display:block}

@page{size:A4 portrait;margin:8mm}
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .bar,header,.hint,.todo{display:none}
  .sheet{border:0;border-radius:0;padding:0;margin:0;overflow:visible;background:#fff;break-after:page}
  .view > .sheet:last-child{break-after:auto}
  .sheet h2{font-size:15pt;margin:0 0 3mm}
  .sheet h3{margin:4mm 0 2mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body data-view="cards">
<div class="wrap">
  <header>
    <h1>Matériel à imprimer</h1>
    <p>Tout ce qui se pose sur la table en plus du plan : les cartes, les jetons, les documents que le MJ remet, et l'aide de jeu.</p>
  </header>

  <div class="bar">
    <span class="seg" role="group" aria-label="Vue">
      <button type="button" data-view="cards" aria-pressed="true">Cartes personnage</button>
      <button type="button" data-view="tokens" aria-pressed="false">Jetons</button>
      <button type="button" data-view="docs" aria-pressed="false">Documents</button>
      <button type="button" data-view="aid" aria-pressed="false">Aide de jeu</button>
    </span>
    <button type="button" class="print" onclick="window.print()">Imprimer cette vue</button>
  </div>
  <p class="hint" id="hint"></p>

  <div class="view v-cards" id="v-cards"></div>
  <div class="view v-tokens" id="v-tokens"></div>
  <div class="view v-docs" id="v-docs"></div>
  <div class="view v-aid" id="v-aid"></div>
</div>

<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sheet = (title, inner) => `<section class="sheet"><h2>${title}</h2>${inner}</section>`;
const fig = (inner, caption) => `<figure>${inner}<figcaption>${caption}</figcaption></figure>`;

const HINTS = {
  cards:"Recto-verso, retourner sur le bord long : les versos sont rangés en miroir pour tomber pile derrière leur recto. Sans recto-verso, imprimer les deux pages et les coller dos à dos.",
  tokens:"Imprimer à 100 % (taille réelle) : les jetons de 28 mm entrent dans les cases de la piste du sablier. Sur papier épais, ou collés sur du carton.",
  docs:"Imprimer à 100 %, découper au ras du papier. La légende sous chaque document dit quand le remettre : elle part à la découpe.",
  aid:"Imprimer à 100 % : les cases de la piste font la taille des jetons."
};

/* ---------- Emblèmes des personnages (60 × 60) ---------- */
const ICON = {
  // Un plan griffonné, chemin en pointillés jusqu'à la croix.
  plan:`<rect x="9" y="11" width="42" height="38" rx="2" fill="#fffdf8" stroke="#1f1b24" stroke-width="2"/>
    <path d="M15,42 Q24,20 34,32 T45,18" fill="none" stroke="#1f1b24" stroke-width="1.8" stroke-dasharray="3 2.5"/>
    <path d="M42,14 l6,6 M48,14 l-6,6" stroke="#b3261e" stroke-width="2.4" stroke-linecap="round"/>`,
  sparkle:`<path d="M27,6 L32,23 L49,28 L32,33 L27,50 L22,33 L5,28 L22,23 Z" fill="#e8d38f" stroke="#1f1b24" stroke-width="2" stroke-linejoin="round"/>
    <path d="M46,40 L48,46 L54,48 L48,50 L46,56 L44,50 L38,48 L44,46 Z" fill="#e8d38f" stroke="#1f1b24" stroke-width="1.5" stroke-linejoin="round"/>`,
  loupe:`<line x1="35" y1="35" x2="51" y2="51" stroke="#1f1b24" stroke-width="7" stroke-linecap="round"/>
    <circle cx="25" cy="25" r="15" fill="#dfe8f2" stroke="#1f1b24" stroke-width="3.5"/>
    <path d="M17,20 q4,-6 10,-6" fill="none" stroke="#fffdf8" stroke-width="2.5" stroke-linecap="round"/>`,
  bone:`<g fill="#e8d38f" stroke="#1f1b24" stroke-width="2"><circle cx="14" cy="23" r="7"/><circle cx="14" cy="37" r="7"/>
    <circle cx="46" cy="23" r="7"/><circle cx="46" cy="37" r="7"/></g><rect x="14" y="24" width="32" height="12" fill="#e8d38f"/>
    <path d="M17,24 H43 M17,36 H43" stroke="#1f1b24" stroke-width="2"/>`,
  paw:`<g fill="#7a5a3a" stroke="#1f1b24" stroke-width="1.5"><ellipse cx="30" cy="40" rx="12" ry="10"/>
    <ellipse cx="15" cy="26" rx="5" ry="6.5"/><ellipse cx="24" cy="15" rx="5" ry="6.5"/><ellipse cx="36" cy="15" rx="5" ry="6.5"/><ellipse cx="45" cy="26" rx="5" ry="6.5"/></g>`,
  bolt:`<polygon points="35,4 13,33 27,33 22,56 47,24 33,24 39,4" fill="#f3b14a" stroke="#1f1b24" stroke-width="2" stroke-linejoin="round"/>`
};

/* Textes joueurs : pas de spoiler (rien sur la Chambre ni sur les pièces où la capacité sert). */
const CARDS = [
  {name:"Fred", icon:"plan", q:"« Les gars, j'ai un plan ! »",
    rule:"Rend son usage à la capacité d'un autre joueur, déjà utilisée. Pas à la sienne."},
  {name:"Daphné", icon:"sparkle", q:"« Un jeu d'enfant ! »",
    rule:"Au choix : un déplacement gratuit, ou une action payante gratuite."},
  {name:"Véra", icon:"loupe", q:"« Œil de lynx »",
    rule:"Inspecte la pièce où se trouve le groupe : le MJ dit si quelque chose cloche."},
  {name:"Sammy", icon:"bone", q:"« Donner un Scooby-Snack »",
    rule:"Amadoue un animal. Une boîte de Scooby-Snacks permet de retourner la carte face visible."},
  {name:"Scooby", icon:"paw", q:"« Renifler »",
    rule:"Avant une action payante. Il bâille : rien. Il remue la queue : quelque chose. Il s'excite : très important."},
  {name:"Scrappy", icon:"bolt", q:"« Puppy Power ! »",
    rule:"Force une porte fermée à clé."}
];
const FOOT = "Une seule fois dans la partie, pendant une journée, sans coût en temps. Retourner la carte après usage.";

const cardFront = c => `<div class="card"><div class="in">
  <div class="name">${esc(c.name)}</div>
  <svg viewBox="0 0 60 60" aria-hidden="true">${ICON[c.icon]}</svg>
  <p class="q">${esc(c.q)}</p><p class="rule">${esc(c.rule)}</p><p class="foot">${FOOT}</p></div></div>`;
const cardBack = c => `<div class="card back"><div class="in"><div class="name">${esc(c.name)}</div><div class="used">Capacité utilisée</div></div></div>`;
// Recto-verso sur le bord long : chaque rangée de trois s'inverse au verso.
const mirrored = list => list.reduce((rows, c, i) => (i % 3 ? rows[rows.length-1].push(c) : rows.push([c]), rows), [])
  .flatMap(r => [...r, ...Array(3 - r.length).fill(null)].reverse());

document.getElementById("v-cards").innerHTML =
  sheet("Cartes personnage · recto", `<div class="cards">${CARDS.map(cardFront).join("")}</div>`)
  + sheet("Cartes personnage · verso", `<div class="cards">${mirrored(CARDS).map(c => c ? cardBack(c) : "<div></div>").join("")}</div>`);

/* ---------- Jetons (100 × 100, imprimés à 28 mm) ---------- */
const TOKEN = {
  sablier:{t:"Sablier", art:`<path d="M36,22 H64 M36,74 H64" stroke="#1f1b24" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M39,22 C39,40 49,44 49,48 C49,52 39,56 39,74 H61 C61,56 51,52 51,48 C51,44 61,40 61,22 Z" fill="#fffdf8" stroke="#1f1b24" stroke-width="2.2"/>
    <path d="M43,30 H57 C55,38 51,42 50,44 C49,42 45,38 43,30 Z M42,72 C44,64 48,61 50,60 C52,61 56,64 58,72 Z" fill="#e8d38f"/>`},
  groupe:{t:"Le groupe", big:true, art:`<rect x="20" y="34" width="60" height="28" rx="6" fill="#9fd356" stroke="#1f1b24" stroke-width="2.2"/>
    <path d="M26,34 L32,24 H68 L74,34" fill="#9fd356" stroke="#1f1b24" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="35" y="27" width="13" height="8" fill="#dfe8f2" stroke="#1f1b24" stroke-width="1.4"/><rect x="52" y="27" width="13" height="8" fill="#dfe8f2" stroke="#1f1b24" stroke-width="1.4"/>
    <path d="M30,48 q5,-6 10,0 t10,0 t10,0" fill="none" stroke="#f3b14a" stroke-width="3"/>
    <circle cx="33" cy="63" r="7" fill="#3a3340"/><circle cx="67" cy="63" r="7" fill="#3a3340"/>`},
  liane:{t:"Liane", art:`<path d="M18,62 C28,30 40,70 50,42 S70,30 82,38" fill="none" stroke="#4f6b33" stroke-width="5" stroke-linecap="round"/>
    <g fill="#8db66a" stroke="#4f6b33" stroke-width="1.4"><ellipse cx="30" cy="42" rx="7" ry="4" transform="rotate(-40 30 42)"/>
    <ellipse cx="46" cy="58" rx="7" ry="4" transform="rotate(30 46 58)"/><ellipse cx="62" cy="30" rx="7" ry="4" transform="rotate(-20 62 30)"/>
    <ellipse cx="74" cy="46" rx="6" ry="3.5" transform="rotate(40 74 46)"/></g>`},
  cle:{t:"Cave (double)", art:`<circle cx="32" cy="46" r="12" fill="none" stroke="#8a6a3a" stroke-width="6"/>

/* ---------- Aide de jeu ----------
   La piste : 6 cases de 30 mm pour des jetons de 28 mm. On retire un jeton à chaque cran, de gauche à droite. */
function trackSVG(){
  const W = 190, H = 64, r = 15, gap = 31, x0 = 2.5;   // en millimètres
  const slots = Array.from({length:6}, (_, i) => {
    const n = 6 - i, x = x0 + r + i*gap, j2 = n > 4;
    return `<circle class="tr-slot${j2 ? " j2" : ""}" cx="${x}" cy="28" r="${r}"/><text class="tr-n" x="${x}" y="28">${n}</text>
      <text class="tr-s" x="${x}" y="50">${j2 ? "jour 2 seulement" : ""}</text>`;
  }).join("");
  const xLast = x0 + r + 5*gap;
  return `<svg class="track" viewBox="0 0 ${W} ${H}" style="width:${W}mm" role="img" aria-label="Piste du sablier">
    <rect class="tr-board" x=".5" y=".5" width="${W-1}" height="${H-1}" rx="4"/>
    <text class="tr-h" x="6" y="9">Le sablier</text>
    ${slots}
    <text class="tr-l" x="${xLast}" y="48">Jour 1 : 21h</text><text class="tr-l" x="${W - 4}" y="52.5" style="text-anchor:end">Jour 2 : Dernière chance !</text>
    <text class="tr-s" x="${W/2}" y="${H-2.5}">Jour 1 : 4 jetons (cases 4 à 1) · Jour 2 : 6 jetons. Quand le dernier jeton tombe, la nuit tombe.</text>
  </svg>`;
}
