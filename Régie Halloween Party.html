/* Les notes du MJ deviennent utilisables : le son à jouer ou le script à ouvrir a son bouton à côté de la note.
   Les correspondances ci-dessous couvrent les notes dont les mots ne sont pas le nom du fichier ;
   sinon, un fichier dont le nom est cité dans la note est retrouvé tout seul. */
const NOTE_MEDIA = [
  [/miaul/i, "son", "Miaou"], [/[ée]ternuement/i, "son", "Sneeze"], [/choc [ée]lectrique/i, "son", "Electric Shock"],
  [/toc toc/i, "son", "Door knock"], [/porte qui grince/i, "son", "Door creak opening"], [/porte qui s'ouvre/i, "son", "Door basement"],
  [/scrappy qui (d[ée]boule|casse)/i, "son", "Cartoon Crash"], [/cloche|carillon|douze coups/i, "son", "Bell"],
  [/divers sons/i, "son", "Door creak opening"], [/divers sons/i, "son", "Ombre"],
  [/ambiance joyeuse/i, "ambiance", "Scooby Gang instru"], [/ambiance lugubre/i, "ambiance", "Ambiance jour 1"],
  [/musique d'introduction/i, "musique", "Scooby-Doo, où es-tu"], [/g[ée]n[ée]rique/i, "musique", "Quoi dneuf Scooby-Doo"]
];
function noteMedia(text){
  // Une consigne de son, pas n'importe quelle note qui contient le mot « son » : « Jouer… », « Son : … ».
  if(!/^\s*(jouer|lancer|actionner|son\s*:|musique\s*:)/i.test(text)) return [];
  const listed=NOTE_MEDIA.filter(([re])=>re.test(text)).map(([,k,n])=>findMedia(k,n)).filter(Boolean);
  if(listed.length) return listed;
  const t=mediaKey(text);
  const named=media.list.filter(m=>new RegExp(`(^|[^a-z])${m.key.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}([^a-z]|$)`).test(t))
    .sort((a,b)=>b.key.length-a.key.length).slice(0,1);
  if(named.length) return named;
  return /vid[ée]o/i.test(text) ? media.list.filter(m=>m.kind==="video").slice(0,1) : [];
}
function noteScript(text){
  const m=text.match(/script\s+\**([A-Z]\d*[a-z]?(?:-\d+[A-Z]?)?)\b/) || text.match(/script\b.*\(([A-Z])\)/);
  return m && BOOK.has(m[1]) ? readBtn(m[1]) : "";
}
const ELEMENT_NAME = Object.fromEntries(Object.values(ELEMENTS).flat());
function scriptCard(s){
  const read=!!S.read[s.code], from=ui.from===s.code;
  const {links, rest, restCap} = linkActions(s);
  let n=0, body="", close="";
  for(const [i,r] of s.rows.entries()){
    if(r.type==="action"){
      body+=close; close="";
      const link=links.get(n), k=`${s.code}#${n}`;
      n++;
      const cls=/gratuit/i.test(r.cost) ? "free" : /capacit/i.test(r.cost) ? "capa" : "";
      // Une action sans rien à déplier (« Continuer l'exploration ») reste une simple ligne.
      if(!link && (i+1===s.rows.length || s.rows[i+1].type==="action")){
        body+=`<div class="opt-plain"><span class="n">${n}.</span><b>${fmt(r.text)}</b>${r.cost?`<span class="cost ${cls}">${esc(r.cost)}</span>`:""}</div>`;
        continue;
      }
      body+=`<details class="opt" data-k="${esc(k)}" ${ui.opts.has(k)?"open":""}>
        <summary class="opt-h"><span class="n">${n}.</span><b>${fmt(r.text)}</b>${r.cost?`<span class="cost ${cls}">${esc(r.cost)}</span>`:""}${link&&linkDone(link)?`<span class="cost free">fait ✓</span>`:""}</summary>
        <div class="opt-body">${link?`<div class="opt-btns">${linkBtns(link)}</div>`:""}`;
      // Le bouton passe avant le texte : on clique d'abord, on lit ensuite.
      close=`</div></details>`;
    } else if(r.type==="res") body+=`<div class="res"><span class="res-l">Résultat</span><span>${fmt(r.text)}</span></div>`;
    else if(r.type.startsWith("m-")){
      // Ligne Son / Ambiance / Vidéo : le bouton du fichier du même nom, ou un avertissement s'il manque.
      const kind=r.type.slice(2), m=findMedia(kind, r.text);
      body+= m ? `<div class="media-line">${mediaBtn(m)}</div>`
        : `<div class="media-line missing"><span>${MEDIA_LABEL[kind]} : ${esc(r.text)}</span><span>${media.loaded?`fichier introuvable dans medias/${MEDIA_DIR_OF[kind]}`:"recherche des fichiers…"}</span></div>`;
    }
    else {
      const extras = r.type==="mj"||r.type==="txt" ? noteMedia(r.text).map(mediaBtn).join("")+noteScript(r.text) : "";
      body+= extras ? `<div class="${r.type} note-plus"><span>${fmt(r.text)}</span><span class="note-btns">${extras}</span></div>`
        : `<p class="${r.type}">${fmt(r.text)}</p>`;
    }
  }
  body+=close;
  if(rest.length || restCap) body+=`<div class="opt-rest"><span class="eyebrow">À noter dans la régie</span>
    ${restCap?`<div class="row"><span>${esc(restCap.t)}</span>${bookCapBtns(restCap)}</div>`:""}
    ${rest.map(a=>`<div class="row"><span>${esc(a.t)}</span>${bookActBtns(a)}</div>`).join("")}</div>`;
  return `<article class="script ${read?"read":""} ${from?"flash":""}" id="sc-${esc(s.code)}">
    <div class="script-h">
      <span class="chip lamp">${esc(s.code)}</span><h3>${fmt(s.title||ELEMENT_NAME[s.code]||s.code)}</h3>
      <button class="btn sm ${read?"ghost":from?"lamp":""}" data-act="bookRead" data-c="${esc(s.code)}" aria-pressed="${read}">${read?"Lu ✓":from&&!dock.matches?"Lu, retour à la régie":"Marquer lu"}</button>
    </div>
    ${body}
  </article>`;
}
function renderBook(){
  renderedDock=dock.matches;
  const shown=dock.matches || ui.book;
  $("book").hidden=!shown;
  if(!shown) return;
  const link=getLink(), when=bookSrc.at && new Date(bookSrc.at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
  $("book-src").textContent =
      link && ui.offline ? `Google Sheets injoignable : ${when?`dernière version chargée le ${when}`:"livret intégré affiché"}.`
    : link ? `Google Sheets, chargé le ${when}. « Recharger » relit le tableau.`
    : bookSrc.name ? `Excel importé : ${bookSrc.name}, le ${when}.`
    : "Version intégrée (copie des scripts Notion du 21/10). Coller le lien du Google Sheets publié, ou importer un Excel.";
  if(document.activeElement!==$("book-url")) $("book-url").value=link;
  $("book-reload").hidden = !(link || (window.showOpenFilePicker && bookSrc.name));
  const groups={};
  for(const c of BOOK.keys()) (groups[c[0]] ||= []).push(c);
  $("book-toc").hidden=!ui.toc;
  $("toc-btn").setAttribute("aria-expanded", ui.toc);
  // Une ligne par pièce (étiquette puis boutons), plusieurs pièces côte à côte quand la place le permet.
  $("book-toc").innerHTML = Object.entries(groups).map(([g,cs])=>`<div class="toc-group">
    <span class="toc-label">${esc(GROUPS[g]||g)}</span>
    <div class="toc-chips">${cs.map(c=>`<button class="${S.read[c]?"read":""}" data-act="bookGo" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  </div>`).join("");
  $("book-body").innerHTML = [...BOOK.values()].map(scriptCard).join("");
}

function renderPhase(){
  const p=P(), el=$("phase");
  let body="";
  if(p.id==="j1"||p.id==="j2"){
    // Les moments clés (21h, Dernière chance, nuit) sont annoncés par les alertes du sablier.
    body = `
      <div class="panel-head"><h2>${p.label}</h2><span class="eyebrow">Objectif</span></div>
      <p style="margin:0">${p.id==="j1"?"Découvrir d'où vient l'Ombre.":"Trouver la liane et finir de trouver où la tendre."}</p>
      ${scriptList(codesFrom(p.id==="j1"?"J1":"J2"))}`;
  } else if(p.id==="n1"){
    body = `<div class="panel-head"><h2>Nuit 1 : l'arrivée</h2><span class="eyebrow">Racontée</span></div>
      <span class="muted" style="font-size:.85rem">Aucune action, aucun indice sur le chemin de l'Ombre.</span>
      ${scriptList(codesFrom("N1-"))}
      <div class="row"><button class="btn lamp" data-act="next">Le jour se lève : Jour 1</button></div>`;
  } else if(p.id==="n2"){
    body = `<div class="panel-head"><h2>Nuit 2 : la première apparition</h2><span class="eyebrow">Racontée</span></div>
      <span class="chip ${S.liane.found?"ok":""}" style="align-self:flex-start">Liane : ${S.liane.found?"trouvée":"pas trouvée"}</span>
      ${scriptList(codesFrom("N2-"))}
      <div class="row"><button class="btn lamp" data-act="next">Le jour se lève : Jour 2</button></div>`;
  } else if(p.id==="n3"){
    const pl=S.liane.placed;
    let res=`<div class="alert night"><b>« Où tendez-vous la liane ? »</b><span>Touchez la pièce choisie.</span>${S.liane.found?"":`<span class="muted">Le groupe n'a pas la liane : les Sylvains la déposent devant le Salon (note de N3-1).</span>`}</div>`;
    if(pl==="E") res=`<div class="alert"><b>Bon endroit : la Chambre.</b><span>L'Ombre sort du conduit et trébuche dans la liane : capturée directement.</span></div>`;
    else if(pl) res=`<div class="alert warn"><b>Mauvais endroit : ${ROOMS[pl].name}.</b><span>Elle enjambe la liane si elle la croise et trouve le groupe. Course-poursuite racontée, puis les joueurs l'attirent vers la liane : capturée.</span></div>`;
    res+=`<div class="go-row">${roomChips()}</div>`;
    const after = pl==="E" ? ["N3-2A", "N3-3B"] : pl ? ["N3-2B", "N3-3B"] : [];
    body = `<div class="panel-head"><h2>Nuit 3 : le piège</h2><span class="eyebrow">Le final</span></div>
      ${res}${scriptList(["N3-1", ...after])}
      <div class="row"><button class="btn lamp" data-act="next" ${pl?"":"disabled"}>Démasquer l'Ombre</button></div>`;
  } else {
    const used=CAPS.filter(c=>S.caps[c.k].used).length;
    const seen=Object.keys(ROOMS).filter(r=>S.visited[r]).length;
    body = `<div class="panel-head"><h2>Fin : le démasquage</h2><span class="eyebrow">Épilogue</span></div>
      ${scriptList(codesFrom("N4-"))}
      <dl class="kv">
        <dt>Pièces visitées</dt><dd>${seen} sur 7${S.hidden?", plus la pièce cachée":""}</dd>
        <dt>Capacités utilisées</dt><dd>${used} sur 6 (état final)</dd>
        <dt>Liane</dt><dd>${S.liane.placed?`tendue dans ${ROOMS[S.liane.placed].name}`:"pas tendue"}</dd>
      </dl>`;
  }
  el.innerHTML=body;
}

/* Les pièces en boutons courts : se déplacer (le jour) ou tendre la liane (nuit 3) sans déplier le manoir. */
function roomChips(){
  const n3=P().id==="n3";
  return Object.keys(ROOMS).filter(r=>n3 || r!==S.room).map(r=>{
    let meta="", cls="";
    if(n3){ if(S.liane.placed===r){ meta="liane ici"; cls="on"; } }
    else if(!accessible(r)){ meta="fermée"; cls="locked"; }
    else { const c=cost(S.room,r); meta = c===0 || S.joker==="move" ? "gratuit" : `${c} cran${c>1?"s":""}`; }
    return `<button class="go ${cls}" data-act="room" data-r="${r}"><b>${r}</b>${ROOMS[r].name}${meta?`<small>${meta}</small>`:""}</button>`;
  }).join("");
}
function renderRoom(){
  const el=$("room");
  if(!isDay()){
    el.innerHTML = `<div class="panel-head"><h2>${P().id==="fin"?"Le Laboratoire":"Le Salon"}</h2><span class="eyebrow">La nuit</span></div>
      <p class="muted" style="margin:0">${P().id==="fin"?"On descend libérer Georges.":"Le groupe dort au Salon. Les pièces s'explorent le jour."}</p>`;
    return;
  }
  const r=S.room, d=dayNum();
  const capRow = (k, t, res, btns) => `<div class="act cap"><span class="t"><span class="by">${esc(who(k))}</span>${esc(t)}</span><span class="btns">${btns}</span><span class="r">${esc(res)}</span></div>`;
  const capBtn = (k, label, o) => `<button class="btn fog sm" data-act="cap" data-k="${k}"${o?` data-o="${o}"`:""}>${label}</button>`;
  const roomCaps = [];
  if(capOk("enquetrice")) roomCaps.push(capRow("enquetrice", `Œil de lynx sur ${ROOMS[r].name}`, loupeRes(r), capBtn("enquetrice","Utiliser")));
  if(capOk("meneur")){
    const targets=CAPS.filter(x=>x.k!=="meneur" && S.caps[x.k].used);
    if(targets.length) roomCaps.push(capRow("meneur", "« Les amis, j'ai un plan ! »", "Rend son usage à une capacité déjà utilisée.", targets.map(x=>capBtn("meneur",`Rendre à ${x.role}`,x.k)).join("")));
  }
  // Les actions des éléments se font dans le livret ; ici, un raccourci par élément vers son script.
  const els = ELEMENTS[r].map(([code,name])=>{
    const key = (code==="A1" && d===2 && BOOK.has("A1b")) ? "A1b" : code;
    return readBtn(key, `${key} · ${(BOOK.get(key)||{}).title||name}`);
  }).join("");
  const capLine = CAPS.map(c=>{
    const used = S.caps[c.k].used && !(c.k==="gourmand" && S.snack);
    return `<span class="cap-pill ${used?"used":""}" title="${esc(c.q)}${used?" : utilisée":" : disponible"}">${esc(c.role)}</span>`;
  }).join("");
  el.innerHTML = `
    <div class="panel-head"><h2>${ROOMS[r].name}</h2>${readBtn(r, `Entrée ${r}`)}</div>
    <div class="go-row"><span class="eyebrow">Aller vers</span>${roomChips()}${capOk("elegante") && !S.joker
      ? `<button class="go cap-go" data-act="cap" data-k="elegante" data-o="move" title="Capacité de Daphné : le prochain déplacement est gratuit">Daphné : déplacement gratuit</button>` : ""}</div>
    ${roomCaps.length?`<div class="room-caps">${roomCaps.join("")}</div>`:""}
    <div class="cap-line"><span class="eyebrow">Capacités</span>${capLine}</div>
    <div class="el-links"><span class="eyebrow">Éléments : les actions sont dans le livret</span><div class="scripts">${els}</div></div>`;
}

function renderJournal(){
  $("journal").innerHTML = `
    <div class="panel-head"><h2>Journal</h2><span class="eyebrow">${S.log.length} entrée${S.log.length>1?"s":""}</span></div>
    ${S.log.length ? `<ul class="log">${S.log.map(l=>`<li><span class="w">${l.p}${l.c!==null?` · ${l.c}`:""}</span><span>${esc(l.t)}</span></li>`).join("")}</ul>`
      : `<p class="muted" style="margin:0">Chaque déplacement, action et capacité s'inscrit ici. « Annuler » (ou Ctrl+Z) revient en arrière.</p>`}`;
}

loadBook();
loadMedia();
if(getLink()) loadFromLink(getLink(), true);
if(!S.log.length) log("Nuit 1 commence. Le groupe dort au Salon.");
render();
})();
</script>
