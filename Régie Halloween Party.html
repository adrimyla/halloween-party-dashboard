<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Régie Halloween Party</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IM+Fell+English+SC&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Régie en trois colonnes : le temps, le manoir, l'équipe. Un seul thème sombre, choisi exprès : l'écran sert dans la pénombre de la soirée. */
:root{
  --night:#16111d;
  --panel:#1f1828;
  --panel-2:#2a2136;
  --line:#3c3149;
  --ink:#efe6d4;
  --muted:#a999b9;
  --lamp:#f3b14a;
  --lamp-ink:#2b1a04;
  --lamp-soft:rgba(243,177,74,.14);
  --fog:#a588dd;
  --fog-soft:rgba(165,136,221,.16);
  --ok:#88c9a1;
  --ok-soft:rgba(136,201,161,.14);
  --warn:#ec8d5c;
  --warn-soft:rgba(236,141,92,.15);
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  background:var(--night);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 40px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.42}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.code{font-family:var(--f-code);font-weight:700;letter-spacing:.02em}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:1.35rem;letter-spacing:.02em}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}

/* ---------- Barre du haut ---------- */
.top{
  position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;
  background:var(--night);
  padding-block:12px 10px;
  border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
}
.brand{display:flex;flex-direction:column;gap:0;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.55rem;line-height:1.05}
.rail{display:flex;gap:4px;flex:1 1 520px;min-width:0;overflow-x:auto;padding-bottom:2px}
.step{
  flex:1 0 auto;min-width:92px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;
}
.step b{font-size:.92rem}
.step span{font-size:.72rem;color:var(--muted)}
.step.past{opacity:.55}
.step.now{border-color:var(--lamp);background:var(--lamp-soft)}
.step.now.isnight{border-color:var(--fog);background:var(--fog-soft)}
.tools{display:flex;gap:8px;align-items:center}
.btn{
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;font-weight:700;font-size:.9rem;line-height:1.1;
}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.lamp{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.btn.lamp:hover:not(:disabled){filter:brightness(1.07)}
.btn.fog{background:var(--fog-soft);border-color:var(--fog)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:.8rem}
.confirm{
  width:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;
}

/* ---------- Grille ---------- */
.stack{display:flex;flex-direction:column;gap:16px;margin-top:16px;min-width:0}
/* Le panneau de phase (objectif, scripts à lire) passe toujours avant les actions de la pièce. */
.stack #phase{order:1}
.stack #room{order:2}
.stack .fold{order:3}
.stack #journal{order:4}
.stack #sound-panel{order:0}

/* ---------- Son et vidéo ---------- */
.media-group{display:flex;flex-direction:column;gap:6px}
.media-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.media-btn{
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;min-height:40px;font-size:.88rem;text-align:left;touch-action:manipulation;
}
.media-btn:hover{border-color:var(--muted)}
.media-btn.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.media-btn.video{border-color:var(--fog)}
.media-vol{display:flex;gap:10px;align-items:center;font-size:.8rem;color:var(--muted)}
.media-vol span{min-width:6.5em}
.media-vol input{flex:1;accent-color:var(--lamp);min-height:28px}
.media-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.media-line.missing{font-size:.82rem;color:var(--warn);padding:4px 8px;border:1px dashed var(--warn);border-radius:7px}
.video-layer{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.video-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;background:#111;color:#eee}
.video-screen{flex:1;position:relative;min-height:0;background:#000;overflow:hidden}
.video-screen video,.video-screen canvas{position:absolute;inset:0;width:100%;height:100%;background:#000}
.video-screen canvas{pointer-events:none;opacity:0;image-rendering:pixelated}
/* Lignes de balayage et bords sombres d'un vieux téléviseur, légers pour que la vidéo reste lisible. */
.video-screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.5) 100%)}
/* Le poste s'allume depuis un trait au milieu de l'écran, et s'éteint en un trait puis un point. */
.video-screen.tv-on{animation:tv-on .5s ease-out}
.video-screen.tv-off{animation:tv-off .6s ease-in forwards}
@keyframes tv-on{0%{transform:scale(0,.004);filter:brightness(4)}40%{transform:scale(1,.004);filter:brightness(4)}100%{transform:none;filter:none}}
@keyframes tv-off{0%{transform:none;filter:none}55%{transform:scale(1,.004);filter:brightness(4)}100%{transform:scale(0,.004);filter:brightness(4)}}
.fold summary{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary h2::before{content:"▸ ";color:var(--muted);font-family:var(--f-body);font-size:.9rem}
.fold details[open] summary h2::before{content:"▾ "}
.fold-body{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.go-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.go{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:.84rem;text-align:left}
.go:hover{border-color:var(--muted)}
.go b{font-family:var(--f-code);font-size:.78rem;margin-right:3px}
.go small{font-family:var(--f-code);font-size:.7rem;color:var(--muted);margin-left:4px}
.go.locked small{color:var(--warn)}
.go.on{border-color:var(--fog);background:var(--fog-soft)}
.go.cap-go{border-color:var(--fog);color:var(--fog)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

/* ---------- Sablier ---------- */
.glass-wrap{display:flex;gap:18px;align-items:center}
.glass{width:116px;flex:0 0 116px;display:flex;flex-direction:column;align-items:center}
.bulb{
  width:116px;height:78px;background:var(--panel-2);
  display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:5px;padding:10px 22px;
}
/* « bulb-up » et pas « top » : .top est la classe de l'entête collante, elle faisait coller le sablier en haut. */
.bulb-up{clip-path:polygon(0 0,100% 0,62% 100%,38% 100%);align-content:flex-start}
.bulb-down{clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);align-content:flex-end;flex-wrap:wrap-reverse}
.cap-bar{width:128px;height:6px;background:var(--line);border-radius:3px}
.tok{width:16px;height:16px;border-radius:50%;background:var(--lamp);box-shadow:0 0 10px rgba(243,177,74,.45)}
.tok.fallen{background:var(--line);box-shadow:none}
.count{display:flex;flex-direction:column;gap:2px}
.count .big{font-family:var(--f-display);font-size:3.2rem;line-height:.9;font-variant-numeric:tabular-nums}
.count .big small{font-size:1.3rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.alert{border-radius:8px;padding:10px 12px;border:1px solid var(--lamp);background:var(--lamp-soft);display:flex;flex-direction:column;gap:6px}
.alert.night{border-color:var(--fog);background:var(--fog-soft)}
.alert.warn{border-color:var(--warn);background:var(--warn-soft)}
.alert b{font-size:.98rem}
.joker{border:1px dashed var(--lamp);border-radius:8px;padding:8px 12px;font-size:.88rem;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}


/* ---------- Pièce ---------- */
/* La pièce ne garde que les raccourcis : les actions des éléments sont dans le livret. */
.el-links{display:flex;flex-direction:column;gap:6px}
.cap-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cap-pill{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.cap-pill.used{background:var(--panel-2);color:var(--muted);text-decoration:line-through}

/* ---------- Boutons vers le livret ---------- */
.read-btn{
  font-family:var(--f-code);font-size:.74rem;font-weight:700;line-height:1;
  background:var(--lamp-soft);color:var(--lamp);border:1px solid var(--lamp);border-radius:6px;padding:4px 7px;
}
.read-btn:hover{filter:brightness(1.15)}
.read-btn.read{background:transparent;color:var(--muted);border-color:var(--line)}
.scripts{display:flex;flex-direction:column;gap:6px}
.scripts .read-btn{font-family:var(--f-body);font-size:.88rem;font-weight:400;text-align:left;padding:8px 10px;display:flex;gap:8px;align-items:baseline}
.scripts .read-btn b{font-family:var(--f-code);font-size:.76rem}

/* ---------- Livret ---------- */
.book{
  position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(680px,100%);
  background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.5);
  display:flex;flex-direction:column;
}
.book-top{position:relative;padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.book-top .row{align-items:center}
.book-src{font-size:.78rem;color:var(--muted)}
.book-set{display:flex;flex-direction:column;gap:8px}
.book-set summary{font-size:.8rem;color:var(--muted);cursor:pointer;padding:6px 0}
.book-set[open] summary{margin-bottom:8px}
.book-link input{
  flex:1 1 14em;min-width:0;background:var(--panel-2);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:.85rem;
}
.book-link input::placeholder{color:var(--muted)}
/* Sommaire pensé pour le tactile : un bloc par pièce, des boutons d'au moins 44 × 40 px. */
.book-toc{
  position:absolute;top:100%;left:0;right:0;z-index:6;
  display:flex;flex-wrap:wrap;gap:8px 22px;max-height:70vh;overflow:auto;
  padding:14px 16px 18px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 18px 30px rgba(0,0,0,.5);
}
.toc-btn[aria-expanded="true"]{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.toc-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.toc-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.toc-chips{display:flex;flex-wrap:wrap;gap:6px}
.book-toc button{
  font-family:var(--f-code);font-size:.9rem;font-weight:700;min-width:44px;min-height:40px;padding:6px 8px;
  border-radius:8px;background:var(--panel-2);border:1px solid var(--line);touch-action:manipulation;
}
.book-toc button:hover{border-color:var(--muted)}
.book-toc button.read{opacity:.45}
.book-body{flex:1;overflow:auto;padding:12px 16px calc(40px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:14px}
.script{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:7px;scroll-margin-top:12px}
.script.read{opacity:.5}
.script.read:hover{opacity:.8}
.script.flash{border-color:var(--lamp);box-shadow:0 0 0 2px var(--lamp-soft)}
.script-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.script-h h3{font-family:var(--f-display);font-weight:400;font-size:1.15rem;flex:1;min-width:10em}
/* Une action du livret = un menu déroulant : on ouvre celle que les joueurs choisissent. */
details.opt{padding-left:12px;border-left:2px solid var(--line)}
details.opt[open]{border-left-color:var(--lamp)}
.opt-h{font-size:.92rem;cursor:pointer;list-style:none;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;padding:4px 0}
.opt-h::-webkit-details-marker{display:none}
.opt-h::before{content:"▸";color:var(--muted);width:.8em}
details.opt[open]>.opt-h::before{content:"▾"}
.opt-h:hover b{text-decoration:underline;text-decoration-color:var(--line)}
.opt-h .n{font-family:var(--f-code);color:var(--muted)}
.opt-body{display:flex;flex-direction:column;gap:5px;margin:2px 0 8px}
.opt-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:2px}
.opt-btns .muted{font-size:.8rem}
.opt-plain{padding:4px 0 4px 12px;border-left:2px solid var(--line);font-size:.92rem;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.opt-plain .n{font-family:var(--f-code);color:var(--muted)}
.note-plus{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
.note-plus > span:not(.note-btns){flex:1 1 12em;min-width:0}
.note-btns{display:flex;gap:6px;flex-wrap:wrap;font-style:normal}
.opt-rest{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.opt-rest .row{align-items:center;font-size:.88rem}
.say{margin:0;font-size:.98rem;line-height:1.5;padding:6px 10px;border-left:3px solid var(--lamp);background:rgba(243,177,74,.07);border-radius:0 6px 6px 0}
/* Notes du MJ : bande violette avec l'étiquette « MJ », à part du texte à lire (orange) et du résultat (vert). */
.mj{margin:0;font-size:.88rem;line-height:1.45;color:var(--ink);padding:6px 10px;border-left:3px solid var(--fog);background:var(--fog-soft);border-radius:0 6px 6px 0}
.mj::before{content:"MJ";font-size:.66rem;font-weight:700;letter-spacing:.1em;color:var(--fog);margin-right:8px}
.txt{margin:0;font-size:.9rem}
.li{margin:0;font-size:.9rem;padding-left:14px;position:relative}
.li::before{content:"•";position:absolute;left:2px;color:var(--muted)}
.res{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;padding:7px 10px;border:1px solid var(--ok);border-radius:8px;background:var(--ok-soft);font-size:.92rem}
.res-l{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ok)}
mark.todo{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn);border-radius:4px;padding:0 3px;font-style:normal}
.chip{font-family:var(--f-code);font-size:.74rem;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line)}
.chip.lamp{border-color:var(--lamp);color:var(--lamp)}
.chip.fog{border-color:var(--fog);color:var(--fog)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.act{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:6px 8px;border-radius:7px;background:var(--panel-2)}
.act .t{font-size:.9rem;flex:1 1 11em;min-width:0}
.act .r{font-size:.78rem;color:var(--muted);flex-basis:100%}
.act.done{background:transparent;border:1px solid var(--line)}
.act.done .t{color:var(--muted)}
.act .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.act.cap{background:var(--fog-soft);border:1px solid var(--fog)}
.act .by{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fog);margin-right:6px}
.room-caps{display:flex;flex-direction:column;gap:6px}
.cost{font-family:var(--f-code);font-size:.72rem;color:var(--lamp)}
.cost.free{color:var(--ok)}
.cost.capa{color:var(--fog)}

.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:300px;overflow:auto}
.log li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.84rem}
.log li:first-child{border-top:0}
.log .w{font-family:var(--f-code);font-size:.7rem;color:var(--muted);padding-top:2px}


.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  max-width:min(560px, calc(100% - 32px));
  background:var(--panel-2);border:1px solid var(--lamp);border-radius:10px;
  padding:10px 14px;font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.45);
  z-index:35; /* au-dessus du livret (30), sous les vidéos plein écran (40) */
}
@media (max-width:520px){
  .count .big{font-size:2.6rem}
}
@media (prefers-reduced-motion:no-preference){
  .tok{transition:background .3s, box-shadow .3s}
}

/* ---------- Livret à droite ----------
   À partir de 900px, le livret reste ouvert à côté de la régie et prend toute la largeur restante ;
   en dessous, il s'ouvre par-dessus. Placé en dernier pour l'emporter sur les règles du volet. */
@media (min-width:900px){
  body{padding:0;height:100vh;overflow:hidden}
  .app{display:grid;grid-template-columns:clamp(380px,42vw,560px) minmax(0,1fr);height:100vh}
  .regie{overflow:auto;min-width:0;padding:0 max(16px, env(safe-area-inset-left, 0px)) 40px}
  .book{position:static;width:auto;height:100vh;box-shadow:none}
  .book-toggle,.book-close{display:none}
}
</style>

<div class="app">
<div class="regie" id="regie">
<header class="top" id="top">
  <div class="brand">
    <span class="eyebrow">Halloween Party</span>
    <h1>Régie du MJ</h1>
  </div>
  <nav class="rail" id="rail" aria-label="Phases de la partie"></nav>
  <div class="tools">
    <button class="btn lamp book-toggle" data-act="bookOpen" title="Ouvrir le livret des scripts">📖 Livret</button>
    <button class="btn" id="undo" data-act="undo" title="Annuler la dernière action">Annuler</button>
    <button class="btn ghost" data-act="askReset">Nouvelle partie</button>
  </div>
  <div class="confirm" id="confirm" hidden>
    <span>Effacer la partie en cours et revenir à la Nuit 1 ?</span>
    <button class="btn lamp sm" data-act="reset">Oui, recommencer</button>
    <button class="btn sm" data-act="cancelReset">Garder la partie</button>
  </div>
</header>

<!-- Une seule colonne ; l'ordre jour / nuit se fait en CSS. Manoir, capacités et enquête se replient. -->
<main class="stack" id="stack">
  <section class="panel" id="time"></section>
  <section class="panel fold" id="sound-panel"><details data-fold="sound"><summary id="sound-sum"></summary><div class="fold-body" id="sound"></div></details></section>
  <section class="panel" id="phase"></section>
  <section class="panel" id="room"></section>
        <section class="panel" id="journal"></section>
</main>
</div>
<aside class="book" id="book" aria-label="Livret des scripts" hidden>

  ["C2","","Action","Former un mauvais mot","gratuit"],
  ["C2","","Lire","Vous posez les lettres et il ne se passe rien",""],
  ["C2","","Action","Former WQT","gratuit"],
  ["","","MJ","Jouer le bruit du mécanisme",""],
  ["C2","","Texte","Aller vers le script **C2b**",""],
  ["","","Action","Continuer l'exploration",""],
  ["C2b","Le tiroir","Lire","Soudain, le petit tiroir s'ouvre avec un déclic. À l'intérieur, un plan roulé : le schéma d'un monte-charge. Une cabine monte à la verticale depuis une grande pièce du sous-sol, jusque dans les conduits des cheminées situées juste au-dessus. Dans un coin, une annotation soignée : \"À l'attention de A. Deoux.\"",""],
  ["C2b","","Texte","**Fait 3 :** seules les cheminées au-dessus du Laboratoire sont truquées. Avec le plan des étages, ça élimine le Hall.",""],
  ["","","Action","Continuer l'exploration",""],
  ["C4","La cheminée","Lire","Une grande cheminée en pierre, éteinte. Les briques sont noircies par les années. Sur le manteau, une petite palme dorée sous une cloche de verre. La plaque a été grattée : on ne lit plus que « …2013 ».",""],
  ["C4","","Action","Tisonner les cendres","gratuit"],
  ["C4","","Lire","Sammy prend le tisonnier et comme à remuer les cendres. Un nuage se forme devant le lui, il ne voit plus rien !",""],
  ["","","MJ","Jouer l'éternuement",""],
  ["","","Lire","Il n'y a que des cendres sous les cendres...",""],
  ["C4","","Action","Examiner la cheminée","1 cran"],
  ["C4","","Lire","Sur le sol devant l'âtre, une longue trace en arc de cercle, comme si un pan de la cheminée pivotait.",""],
  ["C4","","Texte","**Fait 3** (même résultat que dans la Chambre : c'est le fait 2 qui départage).",""],
  ["","","Action","Continuer l'exploration",""],
  ["D","Serre : l'entrée","Lire","Une serre aux vitres embuées, envahie de plantes. Dans un coin, des immenses plants de courges avec de grandes feuilles. Un vieil établi de jardinier croule sous les pots. Et au centre, une énorme plante carnivore semble vous suivre du regard.",""],
  ["D1","Les plants de courges","Lire","Vous vous approchez des plants de courges. Les plants sont si denses qu'il est impossible de voir s'il y a quelque chose dessous. Un arrosoir rempli d'eau se trouve à côté.",""],
  ["D1","","Action","Secouer les plantes","gratuit"],
  ["D1","","Lire","Fred s'approche des plantes et les secoue un peu. Vous entendez quelque chose se faufiler entre les feuilles, puis plus rien.",""],
  ["D1","","Action","Arroser les plantes","1 cran"],
  ["D1","","MJ","Aller au script D1b",""],
  ["","","Action","Continuer l'exploration",""],
  ["D1b","Les Sylvains","Lire","Daphné récupère l'arrosoir qui se trouve à côté des plantes et commence à arroser... Tout à coup, une petite créature sort d'entre les feuilles et s'ébroue. Elle a elle-même des feuilles sur la tête et un petit corps tout blanc. D'autres petites créatures sortent alors du plant de courge. Pour vous remercier, elles vous tendent une longue liane, solide comme un câble.",""],
  ["D1b","","MJ","Donner le jeton liane aux joueurs",""],
  ["","","Action","Continuer l'exploration",""],
  ["D2","L'établi","Lire","Un vieil établi couvert de terre, de sachets de graines, d'outils rouillés, de vieux papiers et d'un arrosoir cabossé. On dirait que personne n'y a touché depuis des mois.",""],
  ["D2","","Action","Fouiller l'établi","1 cran"],
  ["D2","","Lire","Véra soulève une pile de pots et découvre une petite clé rouillée. Sur l'étiquette qui lui est attachée, il est écrit : *Sous-sol*.",""],
  ["D2","","MJ","Donner le jeton clé aux joueurs",""],
  ["","","Lire","**Résultat** : le temps avance et vous pouvez désormais ouvrir la porte menant au sous-sol.",""],
  ["","","Action","Continuer l'exploration",""],
  ["D3","La plante carnivore","Lire","Une plante carnivore géante, haute comme un homme. Sa mâchoire s'ouvre et se referme lentement. Elle a l'air d'avoir faim.",""],
  ["D3","","Action","Fouiller son pot","1 cran"],
  ["","","Lire","Sammy plonge doucement la main dans le pot de la plante... Il ne trouve rien du tout et manque de se faire manger la main.",""],
  ["","","Lire","**Résultat :** vous ne trouverez rien et le temps avance d'un cran.",""],
  ["","","Action","Continuer l'exploration",""],
  ["E","Chambre : l'entrée","Lire","Vous entrez dans la chambre. Un grande cheminée se trouve au fond de la pièce. Dans un coin, un tourne-disque entouré de pochettes de vinyles. Sur votre gauche, un drôle de bruit provient du placard, comme une respiration inquiétante.",""],
  ["E1","Le tourne-disque","Lire","Vous approchez du tourne-disque, un vinyle y est posé.",""],
  ["E1","","Action","Écouter la face A","gratuit"],
  ["E1","","MJ","Jouer la musique de Babylone",""],
  ["E1","","Action","Retourner le disque et écouter la face B","gratuit"],
  ["E1","","MJ","Jouer la musique de Dune",""],
  ["E1","","Lire","Vous remarquez une note sur l'étiquette. Il s'agit d'une dédicace en anglais : « To my favourite Lady… — Hans ».",""],
  ["E1","","Action","Regarder les pochettes","gratuit"],
  ["E1","","Lire","Deux pochettes sont présentes. L'une correspond au disque présent mais l'autre est vide.",""],
  ["E1","","Action","Écouter la face A du second vinyle (si trouvé)","gratuit"],
  ["E1","","MJ","Jouer la musique de Poisson Steve",""],
  ["E1","","Action","Retourner le second disque et écouter la face B (si trouvé)","gratuit"],
  ["E1","","MJ","Jouer la musique de No Time to Die",""],
  ["","","Action","Continuer l'exploration",""],
  ["E2","La cheminée","Lire","Une grande cheminée en pierre, éteinte. Les briques sont noircies par les années.",""],
  ["E2","","Action","Examiner la cheminée","1 cran"],
  ["E2","","Lire","Sur le sol devant l'âtre, une longue trace en arc de cercle, comme si un pan de la cheminée pivotait.",""],
  ["E2","","Texte","**Fait 3** (même résultat que dans la Bibliothèque : volontairement, rien ne désigne la Chambre).",""],
  ["","","Action","Continuer l'exploration",""],
  ["E3","Le placard de Nolad","Lire","Fred se dirige vers le placard. La respiration devient de plus en plus forte à mesure qu'il s'approche. Il ouvre la porte d'un coup… et découvre un chat noir et blanc qui dort profondément. Elle respire très fort et semble contente de vous voir !",""],
  ["E3","","Action","Regarder la pile de linge","gratuit"],
  ["E3","","Lire","Sous elle, au milieu des draps, dépassent des morceaux de tissu noir et violet, découpés grossièrement… comme pour coudre une cape.",""],
  ["E3","","Action","Fouiller derrière le chat","1 cran"],
  ["E3","","Lire","Vous essayez de glisser la main derrière elle. Elle vous fixe. Longtemps. Puis, en respirant très fort, elle se décale enfin… d'un centimètre. Juste assez pour attraper ce qu'elle couvait : un vinyle tout chaud. Vouss devriez pouvoir l'écouter sur la platine.",""],
  ["","","Action","Continuer l'exploration",""],
  ["F","Cuisine : l'entrée","Lire","Une cuisine à l'abandon. Des casseroles pendent au plafond. Au fond, la porte entrouverte d'un garde-manger. Sur la table, les restes d'un repas à moitié mangé.",""],
  ["","","MJ","Si la carte de Sammy est déjà utilisée, il la retourne face visible. Sinon, le groupe reçoit le jeton Scooby-Snack, qui s'utilise comme sa capacité.",""],
  ["F1","","Action","Fouiller derrière les bocaux","1 cran"],
  ["","","Lire","Véra fouille entre les bocaux, mais il n'y a que de la nourriture périmée.",""],
  ["F1","","Lire","**Résultat :** le temps avance et vous ne trouvez rien.",""],
  ["","","Action","Continuer l'exploration",""],
  ["F2","Liste de courses","Lire","Une liste de courses posée sur la table, avec un mot épinglé dessus.",""],
  ["F2","","Action","Lire le mot","1 cran"],
  ["","","Lire","\"Pensez à garder les épluchures de légumes et les restes. Merci.\" C'est signé \"Alyse\".",""],
  ["","","Action","Continuer l'exploration",""],
  ["H","Entrée dans le sous-sol","MJ","Si Scrappy-Doo a ouvert la porte, lire à partir d'ici",""],
  ["H","","Lire","En bas de l'escalier, vous retrouvez Scrappy-Doo coincé la tête la première dans une caisse en bois. Véra le sort de là et le remet sur pieds. Il est déboussolé, mais rien de cassé.",""],
  ["H","","MJ","Si la porte a été ouverte avec la clé, lire à partir d'ici",""],
  ["H","","Lire","Le sous-sol est humide et éclairé par une ampoule qui grésille. Au mur, un grand plan du manoir, couvert d'annotations, et un vieux tableau électrique. Sur un établi traînent des outils, des boulons et une pince robotique… on dirait une sorte de grappin. Scooby et Sammy tremblent comme des feuilles...",""],
  ["H","","Lire","Tout au fond de la pièce, vous remarquez une grande porte métallique. Elle a l'air bien plus récente que le manoir et semble impossible à ouvrir par la force.",""],
  ["H1","Le plan technique","Lire","Un plan des circuits électriques du manoir. Il semble avoir été mis à jour récemment, des annotations sont visibles, écrites en rouge.",""],
  ["","","Lire","Que souhaitez-vous faire ?",""],
  ["H1","","Action","Regarder ce qui est écrit","gratuit"],
  ["H1","","Lire","Vous remarquez un détail dans la bibliothèque : une croix rouge se trouve à l'emplacement de la cheminée et une note l'accompagne. Il est écrit \"Hors service, à réparer au plus vite\".",""],
  ["H1","","MJ","**Fait 2** : la cheminée de la bibliothèque est éliminée",""],
  ["H1","","Action","Noter l'emplacement des différentes pièces","1 cran"],
  ["H1","","Lire","Vous regardez plus précisément l'emplacement des différentes pièces.",""],
  ["H1","","MJ","Le MJ place tous les plans de la salle sur le plan du manoir.",""],
  ["H1","","Lire","Vous vous repérez désormais bien mieux dans le manoir ! Cependant, la mystérieuse pièce qui se trouve derrière la porte métallique n'est pas indiquée sur le plan...",""],
  ["H1","","Action","Continuer l'exploration",""],
  ["H2","Le tableau électrique","Lire","Un vieux tableau électrique couvert de poussière avec un compteur.",""],
  ["H2","","Action","Regarder le compteur ","gratuit"],
  ["H2","","Lire","Le compteur défile à toute vitesse. On dirait que quelque chose demande une grande source d'énergie. Pourtant, rien ne semble fonctionner dans le manoir, à part la télévision et le tourne-disque.",""],
  ["H2","","Action","Tenter de couper le courant","1 cran"],
  ["H2","","Lire","Daphné s'approche du disjoncteur et pose la main sur la poignée.",""],
  ["","","MJ","Jouer le son du choc électrique",""],
  ["","","Lire","PAF ! Elle se prend un coup de jus. Sa coiffure est complètement détruite maintenant...",""],
  ["","","Lire","**Résultat:** cela ne change rien et le temps avance.",""],
  ["","","Action","Continuer l'exploration",""],
  ["H3","La porte du Laboratoire","Lire","Une porte en métal, aucune poignée apparente. Elle semble verrouillée de l'intérieur. Vous ne pouvez rien faire.",""],
  ["","","Action","Continuer l'exploration",""],
  ["J1","Jour 1 · Matin : le voisin","Lire","Au petit matin, la pluie est toujours là. Il fait sombre et le tonnerre gronde. Personne n'a fermé l'oeil de la nuit.",""],
  ["","","MJ","Jouer le son du toc toc",""],
  ["","","Lire","Soudain, on frappe à l'entrée. Véra entrouvre la porte. Sur le perron, un vieil homme en ciré jaune avec un sécateur à la main. Il se tient assez loin de la porte et demande : \"Vous avez dormi ICI ? Vous êtes fous ! Je suis le voisin. Je m'occupais du jardin et de la serre de ce manoir. Mais il y a quelques mois, alors que je venais d'arroser les plantes de la serre avec mon petit-fils, nous avons été surpris par un cri terrifiant dans le hall. Un immense spectre violet se trouvait derrière nous. Nous avons pris nos jambes à notre cou et je ne suis jamais revenu ici depuis. Je vous conseille de partir au plus vite !\"",""],
  ["J1","","Lire","Vous expliquez au voisin que votre van est en panne. Il vous propose de le réparer, mais cela risque de prendre du temps. Vous n'avez pas le choix : vous devez rester ici le temps que le van soit réparé.",""],
  ["J1","","Lire","Le voisin plisse les yeux. \"Attendez… Ce van, ces foulards… Mais je vous reconnais ! Vous êtes le Scooby Gang ! Vous allez pouvoir attraper ce fantôme de malheur !\" Scooby et Sammy se cachent derrière Fred. Mais les autres memebres du groupe échangent un regard : il y a un mystère à éclaircir.",""],
  ["J1","","Lire","\"Le plus étrange, c'est que ce jour-là, la porte d'entrée était fermée à clé. Personne n'était entré, j'en suis certain. D'où a-t-elle pu sortir ?\"",""],
  ["J1R","Jour 1 · Les règles (hors histoire)","MJ","Donner le plan vierge du manoir et poser les tuiles du Hall (A) et du Salon (B). Le groupe commence dans le Hall.",""],
  ["","","Puce","**Le sablier :** 4 crans le jour 1, 6 crans le jour 2. Une action payante ou aller dans une autre pièce fait avancer le temps d'un cran. Seul le fait de revenir au hall est gratuit. Choisir un élément, certaines actions, les énigmes et les capacités sont gratuits. **À 0 cran,** le groupe peut encore faire les actions gratuites de la pièce où il se trouve, mais il ne peut plus se déplacer (même vers le Hall), faire une action payante ou utiliser une capacité.",""],
  ["J1R","","Puce","**Les codes :** sur chaque tuile, les éléments ont un code (A1, A2…). Les joueurs annoncent le code, le MJ lit le script. Chaque action annonce son coût.",""],
  ["J1R","","Puce","**Les capacités :** chacune s'utilise une seule fois dans toute la partie. Elles peuvent être jouées n'importe quand pendant une journée et sont cumulables. On retourne la carte après usage. **Insister :** La partie dure deux jours : réfléchissez bien avant d'utiliser vos capacités à usage unique.",""],
  ["J1R","","MJ","Lire le script du Grand Hall (A)",""],
  ["J2","Jour 2 · Matin du jour 2","Lire","Le voisin est de retour sur le perron. \"Alors, vous l'avez vue ? … Et vous êtes encore vivants ?!\" Vous lui expliquez le plan de Fred : un câble tendue en travers de son chemin. \"Un câble ? Je n'ai pas ça sous la main. Mais vous trouverez certainement quelque chose d'utile dans le manoir. En tout cas, ne comptez pas sur moi pour vous accompagner !\"",""],
  ["N1-0","Introduction","MJ","Faire piocher les cartes personnages aux joueurs face cachée (avec les numéros visibles). Indiquez aux joueurs qu'ils devront retourner leur carte quand leur numéro sera annoncé.",""],
  ["N1-0","","MJ","Lancer la musique d'ambiance joyeuse",""],
  ["N1-0","","Lire","Vous êtes une bande d'amis préparant un voyage. C'est enfin les vacances et vous partez tous les six avec votre bon vieux van. L'année a été riche en émotions, vous travaillez tous ensemble et le téléphone n'a pas arrêté de sonner. Les gens s'arrachent vos services pour résoudre des mystères : fantômes, maisons hantées, temples maudits... vous trouvez toujours une explication rationnelle et logique. Vous êtes tellement populaires, que vous avez même votre propre musique pour vous annoncer...",""],
  ["N1-0","","MJ","Jouer la musique d'introduction",""],
  ["N1-0","","Lire","Parmi vous, que des personnalités uniques. Celles-ci se complètent et chacune de vos capacités apporte une force redoutable à votre équipe.",""],
  ["N1-0","","Lire","En premier, c'est Scooby. Malgré une trouille absolue pour le moindre bruit étrange, son flair incomparable lui permet de vous éviter bien des ennuis. Juste à son comportement, vous savez toujours si ce qui se cache derrière un objet en vaut la peine... ou non !",""],
  ["N1-0","","MJ","Le joueur n°1 retourne sa carte : Scooby.",""],
  ["N1-0","","Lire","En deuxième, c'est Sammy, le meilleur ami de Scooby. Toujours affamé, toujours le premier à prendre ses jambes à son cou… et souvent le premier à trouver le frigo. Mais ne vous y trompez pas : avec ses Scooby-Snacks, il sait amadouer n'importe quel animal, même le plus grincheux.",""],
  ["N1-0","","MJ","Le joueur n°2 retourne sa carte : Sammy.",""],
  ["N1-0","","Lire","La troisième, c'est Daphné. Toujours élégante, même au fond d'une crypte, elle a le chic pour se fourrer dans les ennuis… et le talent pour en sortir sans une mèche de travers. Avec elle, ce qui semblait compliqué devient un jeu d'enfant… en un rien de temps !",""],
  ["N1-0","","MJ","Le joueur n°3 retourne sa carte : Daphné.",""],
  ["N1-0","","Lire","La quatrième, c'est Véra, le cerveau de l'équipe. Elle remarque ce que personne d'autre ne voit. Un seul coup d'œil dans une pièce lui suffit pour savoir si quelque chose cloche. C'est souvent elle qui élimine les pistes pour n'en garder qu'une seule.",""],
  ["N1-0","","MJ","Le joueur n°4 retourne sa carte : Véra.",""],
  ["N1-0","","Lire","Le cinquième, c'est Scrappy, le neveu de Scooby. Petit par la taille mais immense par le courage, il ne recule devant rien, et surtout pas devant une porte fermée. Quand il crie \"Puppy Power !\", mieux vaut s'écarter de son chemin.",""],
  ["N1-0","","MJ","Le joueur n°5 retourne sa carte : Scrappy.",""],
  ["N1-0","","Lire","Le dernier, c'est Fred, le chef de la bande. Foulard impeccable et brushing parfait, il a toujours un plan… et presque toujours un piège. Il sait toujours comment remotiver son équipe dans les moments difficiles.",""],
  ["N1-0","","MJ","Le joueur n°6 retourne sa carte : Fred.",""],
  ["N1-0","","Lire","Mais bien sûr, toutes ces capacités indispensables seront complètement inutiles durant vos vacances ! Le soleil brille pour un mois d'octobre et même si l'air est frais, rien ne pourra vous empêcher de profiter de vos vacances. Vous prenez la route en ce début de soirée.",""],
  ["N1-1","Nuit 1 - Arrivée","MJ","Lancer la musique d'ambiance lugubre",""],
  ["N1-1","","Lire","Cela fait plusieurs heures que vous roulez sous la pluie. Il fait nuit, l'orage gronde et vous ne voyez pas à trois mètres devant vous. Scooby et Sammy râlent et c'est au moins la quinzième fois qu'ils demandent à Fred quand est-ce qu'ils arrivent. Scrappy a besoin de se dégourdir les pattes, Véra a la nausée et Daphné a perdu son rouge à lèvres dans le noir. Bref, il y a une très bonne ambiance dans le van.",""],
  ["N1-1","","Lire","Tout à coup, le moteur se met à faire un drôle de bruit. Il s'emballe, les phares clignotent et puis... plus rien. L'accélérateur ne répond plus et vous vous arrêtez sur le bas côté de la route. Il pleut des cordes et les éclairs fusent dans le ciel. ",""],
  ["N1-1","","Lire","Il faut absolument vous mettre à l'abri : entre deux éclairs, Véra aperçoit une silhouette ressemblant à une maison non loin de là. Vous prenez ce que vous pouvez avec vous et vous vous précipitez vers ce qui ressemble à un étrange manoir.",""],
  ["N1-1","","MJ","Jouer le son de la porte qui grince",""],
  ["N1-1","","Lire","Vous ouvrez la vieille porte du manoir. La tempête est si forte qu'elle vous oblige à vous réfugier à l'intérieur. Malgré une certaine réticence de la part de Scooby et Sammy... vous finissez par entrer. Vous découvrez alors un grand hall lugubre, un immense portrait vous regarde. Le manoir semble abandonné, il y a des fuites d'eau de partout et des planches clouées sur plusieurs portes. Daphné fait un tour rapide des pièces encore ouvertes, une seule semble épargnée par les fuites d'eau : le salon. Vous décidez de vous y installer pour la nuit, en espérant pouvoir réparer le van demain matin, lorsque la tempête sera calmée.",""],
  ["N1-2","Nuit 1 · Minuit","Lire","Vous vous êtes installés sur les canapés du salon. Scooby et Sammy grelottent sur leur couverture. Pendant la nuit, toutes sortes de bruits étranges vous empêchent de fermer l'oeil. Une porte grince, des pas, lents, dans le couloir… puis un rire étrange. Vous ne fermez plus l'œil de la nuit.",""],
  ["N1-2","","MJ","Jouer les divers sons",""],
  ["N2-1","Nuit 2 · La tombée de la nuit","Lire","Le soleil disparaît derrière les arbres. Le voisin est rentré chez lui. Vous vous barricadez dans le salon, les couvertures jusqu'au menton. Scooby et Sammy ont poussé un fauteuil contre la porte.",""],
  ["N2-2","Nuit 2 · Minuit","Lire","L'horloge sonne les douze coups. Au douzième, un raclement résonne dans les murs, quelque part au-dessus de vous… comme quelque chose qui glisse dans un conduit. Puis des pas dans l'escalier. Le fauteuil glisse tout seul. La porte s'ouvre. Pour la première fois, vous la voyez : une ombre violette. Elle est là et pousse un cri terrifiant.",""],
  ["N2-3","Nuit 2 · Cachez-vous !","MJ","Jouer la musique de tension",""],
  ["N2-3","","Lire","Panique générale ! Les couvertures volent, le fauteuil se renverse et tout le monde détale dans le noir, chacun de son côté. Bientôt, le manoir redevient silencieux… Seuls résonnent les pas de l'Ombre. Elle vous cherche.",""],
  ["N2-3","","MJ","Pour chaque personnage, à tour de rôle : choisir où se cacher dans le manoir.",""],
  ["N2-3","","MJ","Ordre : Fred, Véra, Daphné, Scrappy, Scooby, puis Sammy en dernier : c'est toujours lui que l'Ombre repère. Pour chaque personnage : lire son intro, compter 5 secondes à voix haute (sans réponse : première cachette), puis lire la phrase de la cachette choisie.",""],
  ["N2-3","","Lire","Fred se réfugie dans le Hall. Il hésite entre derrière la porte d'entrée et dans l'âtre de la cheminée… Les pas approchent, de plus en plus près. Vite, il faut se cacher !",""],
  ["N2-3","","MJ","Si la cachette est « derrière la porte d'entrée », lire ceci :",""],
  ["N2-3","","Lire","Fred se plaque contre la porte d'entrée et retient son souffle.",""],
  ["N2-3","","MJ","Son : l'Ombre qui passe. Laisser une pause.",""],
  ["N2-3","","Lire","L'Ombre s'arrête juste de l'autre côté du battant… puis repart. Fred n'est pas repéré.",""],
  ["N2-3","","MJ","Si la cachette est « dans l'âtre de la cheminée », lire ceci :",""],
  ["N2-3","","Lire","Fred se glisse dans l'âtre de la cheminée. Une pluie de suie lui tombe sur la tête. Il ferme les yeux et retient son souffle.",""],
  ["N2-3","","MJ","Son : l'Ombre qui passe. Laisser une pause.",""],
  ["N2-3","","Lire","L'Ombre passe devant la cheminée sans se pencher. Fred n'est pas repéré.",""],
  ["N2-3","","Lire","Véra se réfugie dans le Salon. Elle hésite entre derrière le rideau et sous le canapé… Les pas approchent, de plus en plus près. Vite, il faut se cacher !",""],
  ["N2-3","","MJ","Si la cachette est « derrière le rideau », lire ceci :",""],
  ["N2-3","","Lire","Véra se glisse derrière le rideau et retient son souffle.",""],
  ["N2-3","","MJ","Son : l'Ombre qui passe. Laisser une pause.",""],
  ["N2-3","","Lire","Elle a senti l'Ombre passer juste à côté d'elle, de l'autre côté du velours. Mais elle n'a pas été repérée.",""],

function addFact(n, src){ if(!S.facts[n].includes(src)) S.facts[n].push(src); }
function addHint1(src){ if(!S.hints1.includes(src)) S.hints1.push(src); }

function spend(n, why){
  if(n<=0) return;
  const before=S.crans;
  S.crans=Math.max(0, S.crans-n);
  if(before>1 && S.crans===1){
    if(dayNum()===1) toast("L'horloge sonne 21h : le soleil va bientôt se coucher.");
    if(dayNum()===2) toast("« Dernière chance ! » L'horloge sonne. Dernier moment pour les capacités.");
  }
  if(S.crans===0){ log("Le dernier jeton tombe."); toast("Le dernier jeton tombe : actions gratuites de la pièce seulement, puis la nuit tombe."); }
}

function setPhase(i){
  S.phase=i;
  const p=P();
  S.joker=null;
  if(p.crans){
    S.crans=p.crans; S.room="A"; S.visited.A=true;
    log(`${p.label} commence dans le Hall, ${p.crans} crans.`);
  } else {
    if(p.id==="n1"||p.id==="n2") S.room="B";
    if(p.id==="n2") addHint1("Nuit 2");
    log(`${p.label} commence.`);
  }
}

/* Tri alphanumérique : les chiffres avant les lettres, "A" avant "A1" avant "A1b". */
function natCmp(a, b){
  const x=a.match(/\d+|\D+/g), y=b.match(/\d+|\D+/g);
  for(let i=0; i<Math.min(x.length,y.length); i++){
    const p=x[i], q=y[i], np=/^\d/.test(p), nq=/^\d/.test(q);
    if(np && nq){ if(+p!==+q) return +p-+q; }
    else if(np!==nq) return np ? -1 : 1;
    else if(p!==q) return p<q ? -1 : 1;
  }
  return x.length-y.length;
}
const TYPES = {lire:"say", mj:"mj", note:"mj", puce:"li", action:"action", resultat:"res",
  son:"m-son", ambiance:"m-ambiance", musique:"m-musique", video:"m-video"};
/* « Résultat : … » en tête du texte vaut le type Résultat, quel que soit le type choisi. */
const RES_PREFIX = /^\**\s*r[ée]sultat\s*\**\s*:\s*\**\s*/i;
/* Lignes [code, titre, type, texte, coût] → scripts triés. Un code vide reprend celui du dessus. */
function buildBook(rows){
  const m=new Map(); let last="";
  for(const [c,t,ty,x,cost] of rows){
    const code=String(c??"").trim() || last; if(!code) continue; last=code;
    if(!m.has(code)) m.set(code, {code, title:"", rows:[]});
    const s=m.get(code), text=String(x??"").trim();
    if(t && !s.title) s.title=String(t).trim();
    if(!text) continue;
    const row={type:TYPES[norm(ty).split(/\s/)[0]] || "txt", text, cost:String(cost??"").trim()};
    if(RES_PREFIX.test(text)){ row.type="res"; row.text=text.replace(RES_PREFIX, ""); }
    s.rows.push(row);
  }
  return new Map([...m.entries()].sort((a,b)=>natCmp(a[0],b[0])));
}
function loadBook(){
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem(BOOK_KEY)); }catch(e){}
  if(saved && Array.isArray(saved.rows)){ BOOK=buildBook(saved.rows); bookSrc={name:saved.name, at:saved.at}; }
  else { BOOK=buildBook(BOOK_DEFAULT); bookSrc={name:null, at:null}; }
}

/* Lecture de l'Excel : la bibliothèque SheetJS n'est chargée qu'au premier import. */
function rowsFromSheet(aoa){
  const hi=aoa.findIndex(r=>r.some(c=>norm(c)==="code"));
  if(hi<0) throw new Error("colonne « Code » introuvable");
  const head=aoa[hi].map(norm), ix=["code","titre","type","texte","cout"].map(k=>head.indexOf(k));
  if(ix[3]<0) throw new Error("colonne « Texte » introuvable");
  return aoa.slice(hi+1).map(r=>ix.map(i=>i<0 ? "" : (r[i]??""))).filter(r=>r.some(v=>String(v).trim()));
}
async function readExcel(file){
  if(!window.XLSX) await new Promise((ok,ko)=>{
    const s=document.createElement("script"); s.src=XLSX_URL; s.onload=ok;
    s.onerror=()=>ko(new Error("le lecteur Excel n'a pas pu se charger (connexion internet ?)"));
    document.head.appendChild(s);
  });
  const wb=XLSX.read(await file.arrayBuffer(), {type:"array"});
  const ws=wb.Sheets["Livret"] || wb.Sheets[wb.SheetNames[0]];
  return rowsFromSheet(XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false}));
}
/* Remplace le livret par ces lignes et les garde en mémoire (elles servent aussi hors ligne). */
function useRows(rows, name, quiet){
  const book=buildBook(rows);
  if(!book.size) throw new Error("aucun script trouvé");
  BOOK=book; bookSrc={name, at:Date.now()}; ui.offline=false;
  try{ localStorage.setItem(BOOK_KEY, JSON.stringify({rows, name, at:bookSrc.at})); }catch(e){}
  const missing=EXPECTED.filter(c=>!BOOK.has(c));
  render();
  if(!quiet || missing.length) toast(`Livret chargé : ${BOOK.size} scripts.${missing.length?` Codes absents : ${missing.join(", ")}.`:""}`);
}
async function importFile(file){
  try{
    const rows=await readExcel(file);
    // Un fichier choisi à la main devient la source : plus de lien Google Sheets, même celui par défaut.
    try{ localStorage.setItem(LINK_KEY, NO_LINK); }catch(e){}
    useRows(rows, file.name);
  }catch(e){ toast(`Import impossible : ${e.message}.`); }
}

const DEFAULT_LINK = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSjUyD0s-GK0lG8YM9XhnPzlvW40mQE_fCsT590W4r388krQfRFr7kTgGU90JwxptuBR6umKkFO8Eq-/pub?output=csv";
const NO_LINK = "aucun";
const getLink = () => {
  let v=null;
  try{ v=localStorage.getItem(LINK_KEY); }catch(e){}
  return v===null || v==="" ? DEFAULT_LINK : v===NO_LINK ? "" : v;
};
function sheetCsvUrl(link){
  const u=new URL(link.trim());
  if(u.hostname!=="docs.google.com" || !u.pathname.startsWith("/spreadsheets/d/")) throw new Error("ce n'est pas un lien Google Sheets");
  const pub=u.pathname.match(/^\/spreadsheets\/d\/e\/([\w-]+)/);
  if(pub){
    const gid=u.searchParams.get("gid");
    return `https://docs.google.com/spreadsheets/d/e/${pub[1]}/pub?${gid?`gid=${gid}&single=true&`:""}output=csv`;
  }
  const id=u.pathname.match(/^\/spreadsheets\/d\/([\w-]+)/)[1];
  return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1&sheet=Livret`;
}
function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  t=t.replace(/^﻿/, "");
  for(let i=0; i<t.length; i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(f); f=""; }
    else if(c==="\n"){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(c!=="\r") f+=c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function loadFromLink(link, quiet){
  try{
    let res;
    try{ res=await fetch(sheetCsvUrl(link), {cache:"no-store"}); }
    catch(e){ throw new Error(navigator.onLine ? "le tableau n'est pas publié, ou le lien n'est pas le bon" : "pas de connexion internet"); }
    if(!res.ok) throw new Error(`Google répond ${res.status}, vérifier que le tableau est bien publié`);
    const text=await res.text();
    if(/^\s*</.test(text)) throw new Error("le tableau n'est pas publié, ou le lien n'est pas le bon");
    useRows(rowsFromSheet(parseCSV(text)), "Google Sheets", quiet);
  }catch(e){
    ui.offline=true; render();
    if(!quiet) toast(`Chargement impossible : ${e.message}.`);
  }
}
/* Chrome et Edge retiennent le fichier choisi : « Recharger » le relit sans le rechercher. */
function idb(mode, fn){
  return new Promise((ok,ko)=>{
    const r=indexedDB.open("regie-halloween", 1);
    r.onupgradeneeded=()=>r.result.createObjectStore("h");
    r.onerror=()=>ko(r.error);
    r.onsuccess=()=>{ const tx=r.result.transaction("h", mode), q=fn(tx.objectStore("h")); tx.oncomplete=()=>ok(q.result); tx.onerror=()=>ko(tx.error); };
  });
}

/* ---------- Boutons de la régie dans le livret ----------
   Chaque action du livret retrouve son action de la régie, sans rien à remplir dans le tableau :
   l'action payante de l'élément par son coût « 1 cran », la capacité par la mention « capacité »
   dans le coût, les actions gratuites suivies par leurs mots-clés. Ce qui ne trouve pas sa ligne
   s'affiche en bas du script. */
const FREE_KEYS = {a1c:/cave|sous-sol/i, a2k:/cl[ée]/i, a3c:/courrier/i, b3t:/t[ée]l[ée]/i,
  c2w:/^(?!.*mauvais).*(former|mot secret)/i, c1l:/premi[eè]re page/i, h1p:/plan|[ée]crit/i};
const CAP_LINKS = {
  B1:{k:"gourmand", o:"z1", room:"B", t:"Lui donner un Scooby-Snack", btn:"Donner un Scooby-Snack", done:()=>S.gave.z1, sub:"B1b"},
  C1:{k:"gourmand", o:"z2", room:"C", t:"Lui donner un Scooby-Snack", btn:"Donner un Scooby-Snack", done:()=>S.gave.z2, sub:"C1b"},
  B4:{k:"costaud", o:"F", room:"B", t:"Forcer la porte", btn:"Puppy Power !", done:()=>S.unlocked.F},
  A2:{k:"costaud", o:"H", room:"A", t:"Forcer la porte", btn:"Puppy Power !", done:()=>S.unlocked.H}
};
function linkActions(s){
  const el = s.code==="A1b" ? "A1" : s.code;
  const cands = ACTIONS.filter(a=>a.el===el && (s.code==="A1b" || a.day!==2));
  const opts = s.rows.filter(r=>r.type==="action");
  const links = new Map(), used = new Set();
  const capIx = CAP_LINKS[el] ? opts.findIndex(r=>/capacit/i.test(r.cost)) : -1;
  if(capIx>=0) links.set(capIx, {cap:CAP_LINKS[el]});
  opts.forEach((r,i)=>{
    if(links.has(i) || !/cran/i.test(r.cost)) return;
    const a=cands.find(a=>a.cost && !used.has(a.id));
    if(a){ links.set(i, {a}); used.add(a.id); }
  });
  // Le double de la clé ouvre la cave sans cran (« + 1 cran » dans le livret, c'est la descente au sous-sol).
  for(const a of cands.filter(a=>!a.cost && FREE_KEYS[a.id])){
    const i=opts.findIndex((r,j)=>!links.has(j) && !/capacit/i.test(r.cost) && (a.needKey || !/cran/i.test(r.cost)) && FREE_KEYS[a.id].test(r.text));
    if(i>=0){ links.set(i, {a}); used.add(a.id); }
  }
  return {links, rest:cands.filter(a=>!used.has(a.id)), restCap: CAP_LINKS[el] && capIx<0 ? CAP_LINKS[el] : null};
}

/* ================= Son et vidéo =================
   Les fichiers sont dans le dossier medias/ du dépôt : ambiance, musiques, vinyles, sons, videos.
   La liste vient de l'API GitHub (le dépôt est public) et reste en mémoire pour les ouvertures sans réseau ;
   les fichiers eux-mêmes sont servis à côté de la page.
   Une musique courte coupe l'ambiance en fondu ; l'ambiance reste choisie mais muette, et revient à la fin. */
const MEDIA_REPO = "adrimyla/halloween-party-dashboard";
const MEDIA_KEY = "regie-halloween-medias";
const MEDIA_DIRS = {ambiance:"ambiance", musiques:"musique", vinyles:"musique", sons:"son", videos:"video"};
const MEDIA_DIR_OF = {ambiance:"ambiance", musique:"musiques ou medias/vinyles", son:"sons", video:"videos"};
const MEDIA_EXT = /\.(mp3|ogg|oga|wav|m4a|aac|opus|webm|mp4|m4v|mov)$/i;
const MEDIA_LABEL = {ambiance:"Ambiance", musique:"Musique", son:"Son", video:"Vidéo"};
const media = {list:[], loaded:false, err:null, amb:null, ambKey:null, ambVol:.25,
  track:null, trackKey:null, trackVol:.8, sfxVol:.6, sfx:new Set()};
const mediaKey = s => norm(String(s).replace(MEDIA_EXT, "")).replace(/[-_\s]+/g, " ").trim();
const mediaName = n => { const t=n.replace(/[-_]+/g, " ").trim(); return t.charAt(0).toUpperCase()+t.slice(1); };
const findMedia = (kind, name) => media.list.find(m=>m.kind===kind && m.key===mediaKey(name));

async function loadMedia(){
  try{ const saved=JSON.parse(localStorage.getItem(MEDIA_KEY)); if(Array.isArray(saved)) media.list=saved; }catch(e){}
  try{
    const res=await fetch(`https://api.github.com/repos/${MEDIA_REPO}/git/trees/main?recursive=1`, {cache:"no-store"});
    if(!res.ok) throw new Error(`GitHub répond ${res.status}`);
    const tree=(await res.json()).tree || [];
    media.list = tree.filter(f=>f.type==="blob" && /^medias\/(ambiance|musiques|vinyles|sons|videos)\/[^/]+$/.test(f.path) && MEDIA_EXT.test(f.path))
      .map(f=>{
        const [, dir, file]=f.path.split("/"), name=file.replace(MEDIA_EXT, "");
        return {kind:MEDIA_DIRS[dir], vinyl:dir==="vinyles", name, key:mediaKey(name), url:f.path.split("/").map(encodeURIComponent).join("/")};
      })
      .sort((a,b)=>a.name.localeCompare(b.name, "fr"));
    media.err=null;
    try{ localStorage.setItem(MEDIA_KEY, JSON.stringify(media.list)); }catch(e){}
  }catch(e){ media.err = navigator.onLine ? e.message : "pas de connexion"; }
  media.loaded=true; render();
}

/* Fondu de volume : un seul à la fois par lecteur. */
function fadeTo(el, vol, ms, done){
  clearInterval(el._fade);
  const from=el.volume, steps=Math.max(1, Math.round(ms/30)); let i=0;
  el._fade=setInterval(()=>{
    i++; el.volume=Math.min(1, Math.max(0, from+(vol-from)*i/steps));
    if(i>=steps){ clearInterval(el._fade); if(done) done(); }
  }, 30);
}
// L'ambiance baisse pendant qu'un bruitage joue, pour qu'on l'entende bien.
const ambTarget = () => media.ambVol * (media.sfx.size ? .35 : 1);
const duck = () => { if(media.amb && !media.amb.paused && !ambHeld()) fadeTo(media.amb, ambTarget(), 300); };
const missing = (kind, name) => toast(`${MEDIA_LABEL[kind]} « ${name} » introuvable dans medias/${MEDIA_DIR_OF[kind]}.`);
// L'ambiance choisie se fait entendre seulement s'il n'y a ni musique courte ni vidéo en cours (une télé éteinte ne compte plus).
const ambHeld = () => !!media.track || (!$("video-layer").hidden && !tv.off);
function ambResume(){
  const a=media.amb; if(!a || ambHeld()) return;
  a.volume=0;
  a.play().then(()=>fadeTo(a, ambTarget(), 1200)).catch(()=>{});
}

function ambStop(quick){
  const a=media.amb; if(!a) return;
  media.amb=null; media.ambKey=null;
  fadeTo(a, 0, quick?150:900, ()=>a.pause());
  render();
}
function ambToggle(name){
  const m=findMedia("ambiance", name); if(!m){ missing("ambiance", name); return; }
  if(media.ambKey===m.key){ ambStop(); return; }
  ambStop(true);
  const a=new Audio(m.url); a.loop=true; a.volume=0;
  media.amb=a; media.ambKey=m.key;
  render();
  if(ambHeld()){ toast("Ambiance choisie : elle démarrera à la fin de la musique."); return; }
  a.play().then(()=>fadeTo(a, ambTarget(), 900)).catch(e=>{ toast(`Lecture impossible : ${e.message}`); if(media.amb===a){ media.amb=null; media.ambKey=null; render(); } });
}
/* Craquement de vinyle autour des morceaux du dossier vinyles, en boucle : il monte seul, puis s'efface pendant
   que le morceau arrive en fondu ; à la fin, le morceau s'efface dans le craquement, qui s'éteint à son tour. */
const VINYL = {url:"medias/freesound_community-vinyl-dust2-96633.mp3", vol:1,   // vol : par rapport au volume des musiques
  lead:2, fade:3, tail:2};   // secondes : craquement seul au début, fondus enchaînés, craquement seul à la fin
let audioCtx=null;
function audio(){
  try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  audioCtx.resume().catch(()=>{});
  return audioCtx;
}
const rampParam=(p, vol, secs)=>{ const t=audioCtx.currentTime; p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); p.linearRampToValueAtTime(vol, t+secs); };
const vinylVol = () => media.trackVol*VINYL.vol;
function vinylStart(){
  const d=new Audio(VINYL.url); d.loop=true; d.volume=0;
  d.play().then(()=>fadeTo(d, vinylVol(), 800)).catch(()=>{});
  const v={dust:d, on:true, timer:null,   // on : le craquement doit s'entendre (le curseur de volume le suit)
    // Le morceau arrive (ou repart) : le craquement s'efface (ou revient) pendant le fondu.
    under(){ v.on=false; fadeTo(d, 0, VINYL.fade*1000); },
    back(){ v.on=true; fadeTo(d, vinylVol(), VINYL.fade*1000); },
    // Le morceau est fini : le craquement continue un peu, seul, puis s'éteint.
    end(done){ v.timer=setTimeout(()=>{ v.on=false; fadeTo(d, 0, 1500, ()=>{ d.pause(); done(); }); }, VINYL.tail*1000); },
    stop(ms){ v.on=false; clearTimeout(v.timer); fadeTo(d, 0, ms, ()=>d.pause()); }};
  return v;
}
/* Musique courte : l'ambiance part en fondu pendant que la musique arrive, puis revient à la fin.
   Un morceau du dossier vinyles arrive et repart en fondu enchaîné avec le craquement de vinyle. */
function playTrack(name){
  const m=findMedia("musique", name); if(!m){ missing("musique", name); return; }
  if(media.trackKey===m.key){ stopTrack(); return; }
  if(media.track) dropTrack(media.track, 300);
  const t=new Audio(m.url); t.volume=0;
  media.track=t; media.trackKey=m.key;
  if(media.amb && !media.amb.paused){ const a=media.amb; fadeTo(a, 0, 1200, ()=>{ if(ambHeld()) a.pause(); }); }
  const free=()=>{ if(media.track!==t) return; media.track=null; media.trackKey=null; render(); ambResume(); };
  const v = t._vinyl = m.vinyl ? vinylStart() : null;
  t.onended=()=>{ if(media.track!==t) return; v ? v.end(free) : free(); };
  // Les dernières secondes du vinyle : le morceau s'efface pendant que le craquement revient.
  if(v) t.ontimeupdate=()=>{
    const left=t.duration-t.currentTime;
    if(t._out || !(left<=VINYL.fade)) return;
    t._out=true; v.back(); fadeTo(t, 0, left*1000);
  };
  const go=()=>t.play().then(()=>{ fadeTo(t, media.trackVol, v?VINYL.fade*1000:1200); if(v) v.under(); })
    .catch(e=>{ toast(`Lecture impossible : ${e.message}`); if(media.track===t){ if(v) v.stop(300); free(); } });
  if(v) t._lead=setTimeout(go, VINYL.lead*1000); else go();
  render();
}
// Coupe un morceau en fondu, avec son craquement de vinyle s'il en a un.
function dropTrack(t, ms){
  t.onended=null; t.ontimeupdate=null; clearTimeout(t._lead);
  if(t._vinyl) t._vinyl.stop(ms);
  fadeTo(t, 0, ms, ()=>t.pause());
}
function stopTrack(quick){
  const t=media.track; if(!t) return;
  media.track=null; media.trackKey=null;
  dropTrack(t, quick?150:700);
  render();
  ambResume();
}
function playSound(name){
  const m=findMedia("son", name); if(!m){ missing("son", name); return; }
  const s=new Audio(m.url); s.volume=media.sfxVol;
  const end=()=>{ if(media.sfx.delete(s)) duck(); };
  s.addEventListener("ended", end); s.addEventListener("error", end);
  media.sfx.add(s);
  s.play().then(duck).catch(e=>{ end(); toast(`Lecture impossible : ${e.message}`); });
}
function stopAll(){
  media.sfx.forEach(s=>s.pause()); media.sfx.clear();
  ambStop();
  stopTrack();
}
/* Vieille télé, fabriquée par le navigateur (aucun fichier) : le poste s'allume sur de la neige qui grésille,
   l'image arrive à travers la neige, puis à la fin la neige revient et l'écran s'éteint en un trait. */
const TV = {lead:2.5, fade:1.2, tail:2.5, off:.6, hiss:.2};   // secondes de neige avant, fondu vers l'image, neige après, extinction ; volume du grésillement
const tv = {raf:0, img:null, noise:null, hiss:null, timers:[], waiting:false, off:false};
const tvLater = (fn, secs) => tv.timers.push(setTimeout(fn, secs*1000));
function snowFrame(t){
  const c=$("tv-snow"), w=c.width, h=c.height, g=c.getContext("2d");
  tv.img = tv.img || g.createImageData(w, h);
  const px=new Uint32Array(tv.img.data.buffer), roll=(t/12)%(h*1.4)-h*.2;   // une bande plus claire descend lentement
  for(let y=0;y<h;y++){
    const lift = Math.abs(y-roll)<h*.07 ? 45 : 0;
    for(let x=0;x<w;x++){ const v=Math.min(255, Math.random()*210+lift)|0; px[y*w+x]=0xff000000|v<<16|v<<8|v; }
  }
  g.putImageData(tv.img, 0, 0);
  tv.raf=requestAnimationFrame(snowFrame);
}
function hissStart(){
  const ctx=audio(); if(!ctx) return null;
  if(!tv.noise){
    tv.noise=ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
    const d=tv.noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  const s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
  s.buffer=tv.noise; s.loop=true; f.type="highpass"; f.frequency.value=900; g.gain.value=0;
  s.connect(f).connect(g).connect(ctx.destination); s.start();
  return {s, g};
}
// La neige et son grésillement arrivent ou s'effacent en `secs` secondes.
function snow(on, secs){
  const c=$("tv-snow");
  c.style.transition=`opacity ${secs}s`; c.style.opacity=on?1:0;
  if(on){ if(!tv.raf) tv.raf=requestAnimationFrame(snowFrame); tv.hiss=tv.hiss||hissStart(); }
  if(tv.hiss) rampParam(tv.hiss.g.gain, on?TV.hiss:0, secs);
  if(!on) tvLater(snowStop, secs);
}
function snowStop(){
  cancelAnimationFrame(tv.raf); tv.raf=0;
  if(tv.hiss){ tv.hiss.s.stop(); tv.hiss=null; }
  const c=$("tv-snow"); c.style.transition=""; c.style.opacity=0;
}
function tvReset(){
  tv.timers.forEach(clearTimeout); tv.timers=[]; tv.waiting=false; tv.off=false;
  snowStop();
  $("video-screen").classList.remove("tv-on", "tv-off");
}
/* La vidéo coupe tout le reste ; l'ambiance choisie reprend à la fin.
   Elle commence et finit par quelques secondes de neige, comme une vieille télé. */
function playVideo(name){
  const m=findMedia("video", name); if(!m){ missing("video", name); return; }
  $("video-layer").hidden=false;   // d'abord : l'ambiance voit la vidéo et reste muette
  if(media.amb) media.amb.pause();
  stopTrack(true);
  media.sfx.forEach(s=>s.pause()); media.sfx.clear();
  tvReset();
  const v=$("video"); v.src=m.url; v.volume=0; v.controls=false;
  $("video-title").textContent=mediaName(m.name);
  $("video-screen").classList.add("tv-on");
  snow(true, 0);
  // Lancée puis arrêtée tout de suite, pendant le clic : la tablette accepte ensuite de la lire après la neige.
  tv.waiting=true;
  v.play().then(()=>{ if(tv.waiting){ v.pause(); v.currentTime=0; } }).catch(()=>{});
  tvLater(()=>{
    tv.waiting=false; v.controls=true;
    v.play().then(()=>fadeTo(v, 1, TV.fade*1000)).catch(()=>{});
    snow(false, TV.fade);
  }, TV.lead);
}
/* Fin de la vidéo : la neige revient sur la dernière image, puis le poste s'éteint.
   L'écran reste noir, pour que les joueurs ne voient pas la régie, jusqu'à « Fermer la vidéo » ; l'ambiance reprend déjà. */
function videoEnd(){
  if($("video-layer").hidden) return;
  $("video").controls=false;
  snow(true, .4);
  tvLater(()=>{
    $("video-screen").classList.add("tv-off");
    if(tv.hiss) rampParam(tv.hiss.g.gain, 0, TV.off*.6);
  }, .4+TV.tail);
  tvLater(()=>{ tv.off=true; snowStop(); ambResume(); }, .4+TV.tail+TV.off);
}
function closeVideo(){
  const v=$("video");
  if($("video-layer").hidden) return;
  const wasOff=tv.off;
  tvReset();
  v.pause(); v.removeAttribute("src"); v.load(); v.controls=true;
  $("video-layer").hidden=true;
  if(!wasOff) ambResume();
}
$("video").addEventListener("ended", videoEnd);

/* Bouton d'un média, pour le panneau Son comme pour le livret. */
function mediaBtn(m){
  const act = {son:"sfx", ambiance:"amb", musique:"track", video:"video"}[m.kind];
  const on = (m.kind==="ambiance" && media.ambKey===m.key) || (m.kind==="musique" && media.trackKey===m.key);
  const icon = m.kind==="video" ? "▶" : m.kind==="ambiance" ? (on?"❚❚":"♫") : m.kind==="musique" ? (on?"■":m.vinyl?"◉":"♬") : "♪";
  return `<button class="media-btn ${on?"on":""} ${m.kind==="video"?"video":""}" data-act="${act}" data-n="${esc(m.name)}">${icon} ${esc(mediaName(m.name))}</button>`;
}
function renderSound(){
  const playing = media.ambKey ? media.list.find(m=>m.key===media.ambKey && m.kind==="ambiance") : null;
  const track = media.trackKey ? media.list.find(m=>m.key===media.trackKey && m.kind==="musique") : null;
  $("sound-sum").innerHTML = `<h2>Son</h2><span class="eyebrow">${track ? `Musique : ${esc(mediaName(track.name))}${playing?" · ambiance en attente":""}`

  const empty = media.loaded && !media.list.length
    ? `<span class="muted" style="font-size:.82rem">Aucun fichier trouvé. Déposer les sons dans les dossiers <b>medias/ambiance</b>, <b>medias/musiques</b>, <b>medias/sons</b> et <b>medias/videos</b> du dépôt GitHub, puis « Actualiser ».</span>` : "";
  $("sound").innerHTML = `
    ${!media.loaded ? `<span class="muted" style="font-size:.82rem">Recherche des fichiers…</span>` : ""}
    ${empty}
    ${group("Ambiance (en boucle)", "ambiance")}
    ${group("Musiques courtes (coupent l'ambiance le temps du morceau)", "musique")}
    ${group("Bruitages", "son")}
    ${group("Vidéos", "video")}
    <label class="media-vol"><span>Volume ambiance</span><input type="range" min="0" max="100" value="${Math.round(media.ambVol*100)}" data-media-vol="amb"></label>
    <label class="media-vol"><span>Volume musiques</span><input type="range" min="0" max="100" value="${Math.round(media.trackVol*100)}" data-media-vol="track"></label>
    <label class="media-vol"><span>Volume bruitages</span><input type="range" min="0" max="100" value="${Math.round(media.sfxVol*100)}" data-media-vol="sfx"></label>
    <div class="row">
      <button class="btn" data-act="mediaStop">■ Tout couper</button>
      <button class="btn ghost sm" data-act="mediaReload" title="Relire la liste des fichiers sur GitHub">Actualiser</button>

/* ================= Actions ================= */
const handlers = {
  undo(){
    if(!hist.length) return;
    S=JSON.parse(hist.pop()); save(); render(); toast("Dernière action annulée.");
  },
  askReset(){ $("confirm").hidden=false; },
  cancelReset(){ $("confirm").hidden=true; },
  reset(){
    hist.push(JSON.stringify(S));
    S=fresh(); log("Nouvelle partie."); save(); $("confirm").hidden=true; render();
  },
  phase(d){ const i=+d.i; if(i===S.phase) return; commit(()=>setPhase(i)); },
  next(){ if(S.phase<PHASES.length-1) commit(()=>setPhase(S.phase+1)); },
  tick(){ if(S.crans>0) commit(()=>{ spend(1); log("Le temps avance (−1 cran)."); }); },
  untick(){ const max=P().crans||0; if(S.crans<max) commit(()=>{ S.crans++; log("Un cran rendu (+1)."); }); },
  nightfall(){ commit(()=>{ S.crans=0; log("Le MJ fait tomber la nuit plus tôt."); }); },
  room(d){
    const to=d.r;
    if(P().id==="n3"){ commit(()=>{ S.liane.placed=to; log(`La liane est tendue : ${ROOMS[to].name}.`); }); return; }
    if(!isDay()) return;
    if(to===S.room) return;
    if(S.crans===0){ toast("Plus de crans : le groupe ne peut plus se déplacer, même vers le Hall."); return; }
    let c=cost(S.room,to);
    if(c===Infinity){
      toast(to==="F" ? "La Cuisine est fermée à clé : seul Scrappy peut forcer la porte, depuis le Salon (B4)."
                     : "La cave est fermée à clé : double de la clé (établi de la Serre) ou Scrappy, depuis le Hall (A2).");
      return;
    }
    commit(()=>{
      let note="";
      if(S.joker==="move" && c>0){ c=0; S.joker=null; note=" (déplacement gratuit de Daphné)"; }
      const first=!S.visited[to];
      spend(c);
      S.room=to; S.visited[to]=true;
      log(`Le groupe va dans ${ROOMS[to].name}${c?` (${c} cran${c>1?"s":""})`:" (gratuit)"}${note}.`);
      if(first) toast(`Première visite : lire l'entrée (📖 ${to}) et poser la tuile ${to}.`);
    });
  },
  act(d){
    const a=ACT[d.id]; if(!a || S.done[a.id]) return;
    const locked=a.lock && a.lock(); if(locked){ toast(locked); return; }
    if(a.cost && S.crans===0){ toast("Plus de crans : plus d'action payante."); return; }
    commit(()=>{
      let note="";
      if(a.cost){
        if(d.eleg && !S.caps.elegante.used){ S.caps.elegante.used=true; note=` (gratuit : ${who("elegante")}, « Un jeu d'enfant ! »)`; }
        else if(S.joker==="action"){ S.joker=null; note=" (gratuit grâce à Daphné)"; }
        else spend(a.cost);
      }
      S.done[a.id]=true;
      if(a.fact) addFact(a.fact[0], a.fact[1]);
      if(a.hint) addHint1(a.hint);
      if(a.liane && !S.liane.found) S.liane.found="D1";
      if(a.key) S.key=true;
      // Le dernier Scooby-Snack : Sammy retourne sa carte si elle a servi, sinon le groupe garde le jeton.
      if(a.box){ S.box=true; if(S.caps.gourmand.used) S.caps.gourmand.used=false; else S.snack=true; }
      if(a.needKey) S.unlocked.H=true;
      const res=a.r.replace(/^→\s*/, "");
      log(`${a.el} · ${a.t}${a.cost&&!note?" (1 cran)":""}${note} → ${res}`);
      toast(`${a.el} → ${res}`);
    });
  },
  sniff(d){
    const a=ACT[d.id]; if(!a || S.caps.flaireur.used) return;
    commit(()=>{ S.caps.flaireur.used=true; log(`${who("flaireur")} renifle ${a.el} « ${a.t} » : ${a.sniff}.`); toast(`Renifler ${a.el} : ${a.sniff}.`); });
  },
  cap(d){
    const k=d.k, opt=d.o;
    if(S.caps[k].used && !(k==="gourmand" && S.snack)) return;
    commit(()=>{
      if(k==="meneur"){
        S.caps[opt].used=false; S.caps.meneur.used=true;
        if(opt==="gourmand") {}
        log(`${who("meneur")} : « J'ai un plan ! » ${CAPNAME[opt]} récupère sa capacité.`);
        toast(`${CAPNAME[opt]} peut de nouveau utiliser sa capacité.`);
      }
      if(k==="elegante"){
        S.caps.elegante.used=true; S.joker=opt;
        log(`${who("elegante")} : « Un jeu d'enfant ! » ${opt==="move"?"Le prochain déplacement":"La prochaine action payante"} est gratuit${opt==="move"?"":"e"}.`);
      }
      if(k==="enquetrice"){
        S.caps.enquetrice.used=true;
        const res=loupeRes(S.room);
        if(S.room==="C") addFact(2,"Loupe");
        S.loupe={room:S.room, res};
        log(`${who("enquetrice")} : Œil de lynx dans ${ROOMS[S.room].name}. ${res}`);
        toast(`Œil de lynx : ${res}`);
      }
      if(k==="gourmand"){
        // La carte d'abord ; une fois retournée, le jeton Scooby-Snack de la Cuisine s'il est là.
        if(!S.caps.gourmand.used) S.caps.gourmand.used=true; else S.snack=false;
        if(opt==="z1"){ S.gave.z1=true; S.hidden=true; addFact(1,"B1b"); log(`${who("gourmand")} donne un Scooby-Snack à Pazu → B1b : la pièce cachée (fait 1, fumigènes).`); toast("B1b : pièce cachée. Poser la tuile de la pièce cachée."); }
        else { S.gave.z2=true; log(`${who("gourmand")} donne un Scooby-Snack à Amaya → C1b : elle laisse le journal.`); toast("C1b : Amaya laisse le journal."); }
      }
      if(k==="costaud"){
        S.caps.costaud.used=true; S.unlocked[opt]=true;
        log(`${who("costaud")} : « Puppy Power ! » ${opt==="F"?"La porte de la Cuisine":"La porte de la cave"} cède.`);
      }
    });
  },
  cancelJoker(){ commit(()=>{ S.joker=null; S.caps.elegante.used=false; log("Joker de Daphné annulé."); }); },
  read(d){ openScript(d.c); },
  bookOpen(){ ui.book=true; ui.from=null; render(); },
  bookClose(){ ui.book=false; ui.from=null; render(); },
  bookGo(d){ ui.from=d.c; ui.toc=false; render(); const el=$(`sc-${d.c}`); if(el) el.scrollIntoView({block:"start"}); },
  tocToggle(){ ui.toc=!ui.toc; renderBook(); },
  amb(d){ ambToggle(d.n); },
  track(d){ playTrack(d.n); },
  sfx(d){ playSound(d.n); },
  video(d){ playVideo(d.n); },
  videoClose(){ closeVideo(); },
  mediaStop(){ stopAll(); },
  mediaReload(){ media.loaded=false; render(); loadMedia(); },
  bookRead(d){
    const c=d.c, on=!S.read[c];
    if(on && ui.from===c){ ui.from=null; if(!dock.matches) ui.book=false; }
    setRead(c, on);
  },
  bookImport(){ pickExcel(); },
  bookReload(){ const link=getLink(); if(link) loadFromLink(link); else reloadExcel(); },
  bookLink(){
    const v=$("book-url").value.trim();
    // Champ vidé : retour au tableau par défaut.
    const link=v || DEFAULT_LINK;
    try{ sheetCsvUrl(link); }catch(e){ toast(`Lien refusé : ${e.message}.`); return; }
    try{ if(link===DEFAULT_LINK) localStorage.removeItem(LINK_KEY); else localStorage.setItem(LINK_KEY, link); }catch(e){}
    $("book-url").blur();
    loadFromLink(link);
  }
};

function glass(c,max,idle){
