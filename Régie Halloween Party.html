<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Régie Halloween Party</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IM+Fell+English+SC&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Régie en trois colonnes : le temps, le manoir, l'équipe. Un seul thème sombre, choisi exprès : l'écran sert dans la pénombre de la soirée. */
:root{
  --night:#16111d;
  --panel:#1f1828;
  --panel-2:#2a2136;
  --line:#3c3149;
  --ink:#efe6d4;
  --muted:#a999b9;
  --lamp:#f3b14a;
  --lamp-ink:#2b1a04;
  --lamp-soft:rgba(243,177,74,.14);
  --fog:#a588dd;
  --fog-soft:rgba(165,136,221,.16);
  --ok:#88c9a1;
  --ok-soft:rgba(136,201,161,.14);
  --warn:#ec8d5c;
  --warn-soft:rgba(236,141,92,.15);
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  background:var(--night);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 40px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.42}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.code{font-family:var(--f-code);font-weight:700;letter-spacing:.02em}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:1.35rem;letter-spacing:.02em}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}

/* ---------- Barre du haut ---------- */
.top{
  position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;
  background:var(--night);
  padding-block:12px 10px;
  border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
}
.brand{display:flex;flex-direction:column;gap:0;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.55rem;line-height:1.05}
.rail{display:flex;gap:4px;flex:1 1 520px;min-width:0;overflow-x:auto;padding-bottom:2px}
.step{
  flex:1 0 auto;min-width:92px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;
}
.step b{font-size:.92rem}
.step span{font-size:.72rem;color:var(--muted)}
.step.past{opacity:.55}
.step.now{border-color:var(--lamp);background:var(--lamp-soft)}
.step.now.isnight{border-color:var(--fog);background:var(--fog-soft)}
.tools{display:flex;gap:8px;align-items:center}
.btn{
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;font-weight:700;font-size:.9rem;line-height:1.1;
}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.lamp{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.btn.lamp:hover:not(:disabled){filter:brightness(1.07)}
.btn.fog{background:var(--fog-soft);border-color:var(--fog)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:.8rem}
.confirm{
  width:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:8px 12px;
}

/* ---------- Grille ---------- */
.stack{display:flex;flex-direction:column;gap:16px;margin-top:16px;min-width:0}
/* Le jour, les actions de la pièce passent avant le panneau de phase ; la nuit, l'inverse. */
.stack.day #room,.stack.night #phase{order:1}
.stack.day #phase,.stack.night #room{order:2}
.stack .fold{order:3}
.stack #journal{order:4}
.fold summary{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary h2::before{content:"▸ ";color:var(--muted);font-family:var(--f-body);font-size:.9rem}
.fold details[open] summary h2::before{content:"▾ "}
.fold-body{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.go-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.go{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:.84rem;text-align:left}
.go:hover{border-color:var(--muted)}
.go b{font-family:var(--f-code);font-size:.78rem;margin-right:3px}
.go small{font-family:var(--f-code);font-size:.7rem;color:var(--muted);margin-left:4px}
.go.locked small{color:var(--warn)}
.go.on{border-color:var(--fog);background:var(--fog-soft)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

/* ---------- Sablier ---------- */
.glass-wrap{display:flex;gap:18px;align-items:center}
.glass{width:116px;flex:0 0 116px;display:flex;flex-direction:column;align-items:center}
.bulb{
  width:116px;height:78px;background:var(--panel-2);
  display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:5px;padding:10px 22px;
}
.bulb.top{clip-path:polygon(0 0,100% 0,62% 100%,38% 100%);align-content:flex-start}
.bulb.bottom{clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);align-content:flex-end;flex-wrap:wrap-reverse}
.cap-bar{width:128px;height:6px;background:var(--line);border-radius:3px}
.tok{width:16px;height:16px;border-radius:50%;background:var(--lamp);box-shadow:0 0 10px rgba(243,177,74,.45)}
.tok.fallen{background:var(--line);box-shadow:none}
.count{display:flex;flex-direction:column;gap:2px}
.count .big{font-family:var(--f-display);font-size:3.2rem;line-height:.9;font-variant-numeric:tabular-nums}
.count .big small{font-size:1.3rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.alert{border-radius:8px;padding:10px 12px;border:1px solid var(--lamp);background:var(--lamp-soft);display:flex;flex-direction:column;gap:6px}
.alert.night{border-color:var(--fog);background:var(--fog-soft)}
.alert.warn{border-color:var(--warn);background:var(--warn-soft)}
.alert b{font-size:.98rem}
.joker{border:1px dashed var(--lamp);border-radius:8px;padding:8px 12px;font-size:.88rem;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.timeline .when{font-family:var(--f-code);font-size:.78rem;color:var(--muted);padding-top:2px}
.timeline li.past{opacity:.5}
.timeline li.now .when{color:var(--lamp)}

/* ---------- Plan ---------- */
.plan{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:6px;align-items:stretch}
.lvl{font-family:var(--f-code);font-size:.72rem;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);display:grid;place-items:center;border-right:1px solid var(--line)}
.void{border-radius:8px}
.sealed{border-radius:8px;background:repeating-linear-gradient(-45deg,var(--panel) 0 6px,var(--panel-2) 6px 8px);border:1px solid var(--line);min-height:64px}
.tile{
  min-height:84px;border-radius:8px;border:1.5px dashed var(--line);background:transparent;
  padding:7px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;min-width:0;
}
.tile .letter{font-family:var(--f-code);font-weight:700;font-size:1.05rem}
.tile .nm{font-size:.82rem;line-height:1.15;overflow-wrap:anywhere}
.tile .meta{margin-top:auto;font-size:.7rem;color:var(--muted);font-family:var(--f-code)}
.tile.visited{border-style:solid;background:var(--panel-2)}
.tile.here{border-color:var(--lamp);background:radial-gradient(120% 90% at 50% 0%, rgba(243,177,74,.28), var(--panel-2) 70%)}
.tile.here .meta{color:var(--lamp)}
.tile.locked .meta{color:var(--warn)}
.tile.trap{border-color:var(--fog);background:var(--fog-soft)}
.tile:hover:not(:disabled){border-color:var(--muted)}
.tile.here:hover:not(:disabled){border-color:var(--lamp)}
.tile.lab{border:1.5px solid var(--fog);background:transparent;cursor:default}
.tile.lab .letter{color:var(--fog)}
.chem{position:absolute;top:7px;right:8px;width:10px;height:12px;border:1.5px solid var(--muted);border-bottom:0;border-radius:2px 2px 0 0;opacity:.7}
.chem::after{content:"";position:absolute;left:1.5px;right:1.5px;bottom:0;height:5px;background:var(--muted);opacity:.4}
.hidden-room{font-size:.68rem;color:var(--fog);font-family:var(--f-code)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1.5px solid var(--line)}

/* ---------- Pièce ---------- */
.elements{display:flex;flex-direction:column;gap:10px}
.el{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.el:first-child{border-top:0;padding-top:0}
.el-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- Boutons vers le livret ---------- */
.read-btn{
  font-family:var(--f-code);font-size:.74rem;font-weight:700;line-height:1;
  background:var(--lamp-soft);color:var(--lamp);border:1px solid var(--lamp);border-radius:6px;padding:4px 7px;
}
.read-btn:hover{filter:brightness(1.15)}
.read-btn.read{background:transparent;color:var(--muted);border-color:var(--line)}
.scripts{display:flex;flex-direction:column;gap:6px}
.scripts .read-btn{font-family:var(--f-body);font-size:.88rem;font-weight:400;text-align:left;padding:8px 10px;display:flex;gap:8px;align-items:baseline}
.scripts .read-btn b{font-family:var(--f-code);font-size:.76rem}

/* ---------- Livret ---------- */
.book{
  position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(680px,100%);
  background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.5);
  display:flex;flex-direction:column;
}
.book-top{padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.book-top .row{align-items:center}
.book-src{font-size:.78rem;color:var(--muted)}
.book-set{display:flex;flex-direction:column;gap:8px}
.book-set summary{font-size:.78rem;color:var(--muted);cursor:pointer}
.book-set[open] summary{margin-bottom:8px}
.book-link input{
  flex:1 1 14em;min-width:0;background:var(--panel-2);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:.85rem;
}
.book-link input::placeholder{color:var(--muted)}
.book-toc{display:flex;flex-wrap:wrap;gap:5px 16px;max-height:22vh;overflow:auto}
.book-toc div{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.book-toc span{font-size:.7rem;color:var(--muted);margin-right:3px}
.book-toc button{font-family:var(--f-code);font-size:.72rem;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line)}
.book-toc button.read{opacity:.45}
.book-body{flex:1;overflow:auto;padding:12px 16px calc(40px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:14px}
.script{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:7px;scroll-margin-top:12px}
.script.read{opacity:.5}
.script.read:hover{opacity:.8}
.script.flash{border-color:var(--lamp);box-shadow:0 0 0 2px var(--lamp-soft)}
.script-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.script-h h3{font-family:var(--f-display);font-weight:400;font-size:1.15rem;flex:1;min-width:10em}
.opt{display:flex;flex-direction:column;gap:5px;padding-left:12px;border-left:2px solid var(--line)}
.opt-h{font-size:.92rem}
.opt-h .n{font-family:var(--f-code);color:var(--muted)}
.say{margin:0;font-size:.98rem;line-height:1.5;padding:6px 10px;border-left:3px solid var(--lamp);background:rgba(243,177,74,.07);border-radius:0 6px 6px 0}
/* Notes du MJ : bande violette avec l'étiquette « MJ », à part du texte à lire (orange) et du résultat (vert). */
.mj{margin:0;font-size:.88rem;line-height:1.45;color:var(--ink);padding:6px 10px;border-left:3px solid var(--fog);background:var(--fog-soft);border-radius:0 6px 6px 0}
.mj::before{content:"MJ";font-size:.66rem;font-weight:700;letter-spacing:.1em;color:var(--fog);margin-right:8px}
.txt{margin:0;font-size:.9rem}
.li{margin:0;font-size:.9rem;padding-left:14px;position:relative}
.li::before{content:"•";position:absolute;left:2px;color:var(--muted)}
.res{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;padding:7px 10px;border:1px solid var(--ok);border-radius:8px;background:var(--ok-soft);font-size:.92rem}
.res-l{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ok)}
mark.todo{background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn);border-radius:4px;padding:0 3px;font-style:normal}
.chip{font-family:var(--f-code);font-size:.74rem;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line)}
.chip.lamp{border-color:var(--lamp);color:var(--lamp)}
.chip.fog{border-color:var(--fog);color:var(--fog)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.act{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:6px 8px;border-radius:7px;background:var(--panel-2)}
.act .t{font-size:.9rem;flex:1 1 11em;min-width:0}
.act .r{font-size:.78rem;color:var(--muted);flex-basis:100%}
.act.done{background:transparent;border:1px solid var(--line)}
.act.done .t{color:var(--muted)}
.act .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.act.cap{background:var(--fog-soft);border:1px solid var(--fog)}
.act .by{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fog);margin-right:6px}
.room-caps{display:flex;flex-direction:column;gap:6px}
.cost{font-family:var(--f-code);font-size:.72rem;color:var(--lamp)}
.cost.free{color:var(--ok)}
.cost.capa{color:var(--fog)}

/* ---------- Capacités ---------- */
.caps{display:flex;flex-direction:column;gap:8px}
.capc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.capc.used{background:transparent;opacity:.72}
.capc .h{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.capc .who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.capc .role{font-weight:700}
.capc .q{font-size:.82rem;color:var(--muted);font-style:italic}
.capc input{
  background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--ink);
  font:inherit;font-size:.85rem;width:9em;padding:1px 2px;
}
.capc input::placeholder{color:var(--muted);opacity:.7}
.pill{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:999px}
.pill.on{background:var(--ok-soft);color:var(--ok)}
.pill.off{background:var(--panel-2);color:var(--muted)}
.pill.here{background:var(--fog-soft);color:var(--fog)}
.capc .rule{font-size:.82rem}

/* ---------- Enquête ---------- */
.facts{display:flex;flex-direction:column;gap:8px}
.fact{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.fact .n{font-family:var(--f-display);font-size:1.5rem;line-height:1;color:var(--muted);text-align:center}
.fact.got .n{color:var(--ok)}
.fact.part .n{color:var(--lamp)}
.fact .txt{font-size:.88rem}
.fact .srcs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:300px;overflow:auto}
.log li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.84rem}
.log li:first-child{border-top:0}
.log .w{font-family:var(--f-code);font-size:.7rem;color:var(--muted);padding-top:2px}

/* ---------- Chrono ---------- */
.chrono{border:1px solid var(--fog);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--fog-soft)}
.chrono .disp{font-family:var(--f-code);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.chrono .disp.low{color:var(--warn)}
.chrono select{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:inherit;font-size:.85rem}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  max-width:min(560px, calc(100% - 32px));
  background:var(--panel-2);border:1px solid var(--lamp);border-radius:10px;
  padding:10px 14px;font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:20;
}
@media (max-width:520px){
  .plan{grid-template-columns:22px repeat(5,minmax(0,1fr));gap:4px}
  .tile{min-height:74px;padding:5px}
  .tile .nm{font-size:.7rem}
  .tile .meta{font-size:.62rem}
  .count .big{font-size:2.6rem}
}
@media (prefers-reduced-motion:no-preference){
  .tok{transition:background .3s, box-shadow .3s}
  .tile{transition:border-color .15s, background .2s}
}

/* ---------- Livret à droite ----------
   À partir de 900px, le livret reste ouvert à côté de la régie et prend toute la largeur restante ;
   en dessous, il s'ouvre par-dessus. Placé en dernier pour l'emporter sur les règles du volet. */
@media (min-width:900px){
  body{padding:0;height:100vh;overflow:hidden}
  .app{display:grid;grid-template-columns:clamp(380px,42vw,560px) minmax(0,1fr);height:100vh}
  .regie{overflow:auto;min-width:0;padding:0 max(16px, env(safe-area-inset-left, 0px)) 40px}
  .book{position:static;width:auto;height:100vh;box-shadow:none}
  .book-toggle,.book-close{display:none}
}
</style>

<div class="app">
<div class="regie" id="regie">
<header class="top" id="top">
  <div class="brand">
    <span class="eyebrow">Halloween Party</span>
    <h1>Régie du MJ</h1>
  </div>
  <nav class="rail" id="rail" aria-label="Phases de la partie"></nav>
  <div class="tools">
    <button class="btn lamp book-toggle" data-act="bookOpen" title="Ouvrir le livret des scripts">📖 Livret</button>
    <button class="btn" id="undo" data-act="undo" title="Annuler la dernière action">Annuler</button>
    <button class="btn ghost" data-act="askReset">Nouvelle partie</button>
  </div>
  <div class="confirm" id="confirm" hidden>
    <span>Effacer la partie en cours et revenir à la Nuit 1 ?</span>
    <button class="btn lamp sm" data-act="reset">Oui, recommencer</button>
    <button class="btn sm" data-act="cancelReset">Garder la partie</button>
  </div>
</header>

<!-- Une seule colonne ; l'ordre jour / nuit se fait en CSS. Manoir, capacités et enquête se replient. -->
<main class="stack" id="stack">
  <section class="panel" id="time"></section>

/* ================= État ================= */
const KEY = "regie-halloween-mj-v1";
function fresh(){
  return {
    phase:0, crans:4, room:"B",
    visited:{}, unlocked:{F:false,H:false}, key:false, box:false, hidden:false,
    caps:Object.fromEntries(CAPS.map(c=>[c.k,{used:false}])),
    names:{}, joker:null, done:{}, gave:{z1:false,z2:false},
    facts:{1:[],2:[],3:[]}, hints1:[], loupe:null,
    liane:{found:null, placed:null},
    chase:{n2:0, n3:0}, chaseOk:{n2:false, n3:false},
    checks:{}, read:{}, log:[]
  };
}
let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) || fresh(); }catch(e){ S = fresh(); }
S = Object.assign(fresh(), S);
let hist = [];

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function commit(fn){
  hist.push(JSON.stringify(S));
  if(hist.length>120) hist.shift();
  fn();
  save(); render();
}

/* ================= Utilitaires ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s)
  .replace(/\[([^\]]+)\]/g, '<mark class="todo">[$1]</mark>')
  .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
  .replace(/\*(.+?)\*/g, "<i>$1</i>");
const norm = s => String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
const P = () => PHASES[S.phase];
const isDay = () => !!P().crans;
const dayNum = () => P().id==="j1" ? 1 : P().id==="j2" ? 2 : 0;
const who = k => S.names[k] ? `${CAPNAME[k]} (${S.names[k]})` : CAPNAME[k];

function log(t){
  S.log.unshift({p:P().label, c:isDay()?S.crans:null, t});
  if(S.log.length>200) S.log.length=200;
}
let toastTimer;
function toast(t){
  const el=$("toast"); el.textContent=t; el.hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true, 4200);
}
function accessible(r){ return r==="F" ? S.unlocked.F : r==="H" ? S.unlocked.H : true; }
function cost(from,to){
  if(from===to) return 0;
  if(!accessible(to)) return Infinity;
  const dist={[from]:0}, q=[[from,0]];
  while(q.length){
    q.sort((a,b)=>a[1]-b[1]);
    const [r,d]=q.shift();
    if(d>dist[r]) continue;
    for(const n of ADJ[r]){
      if(!accessible(n)) continue;
      const nd = d + (n==="A"?0:1);
      if(dist[n]===undefined || nd<dist[n]){ dist[n]=nd; q.push([n,nd]); }
    }
  }
  return dist[to] ?? Infinity;
}
const capOk = k => isDay() && S.crans>0 && !S.caps[k].used;
function loupeRes(r){

  if(r==="C") return "« Ce mécanisme n'a pas bougé depuis longtemps. » (fait 2)";

}
function addFact(n, src){ if(!S.facts[n].includes(src)) S.facts[n].push(src); }
function addHint1(src){ if(!S.hints1.includes(src)) S.hints1.push(src); }

function spend(n, why){
  if(n<=0) return;
  const before=S.crans;
  S.crans=Math.max(0, S.crans-n);
  if(before>1 && S.crans===1){
    if(dayNum()===1) toast("L'horloge sonne 21h : le soleil va bientôt se coucher.");
    if(dayNum()===2) toast("« Dernière chance ! » L'horloge sonne. Dernier moment pour les capacités.");
  }
  if(S.crans===0){ log("Le dernier jeton tombe : la nuit tombe."); toast("Le dernier jeton tombe : la nuit tombe."); }
}

function setPhase(i){

/* Tri alphanumérique : les chiffres avant les lettres, "A" avant "A1" avant "A1b". */
function natCmp(a, b){
  const x=a.match(/\d+|\D+/g), y=b.match(/\d+|\D+/g);
  for(let i=0; i<Math.min(x.length,y.length); i++){
    const p=x[i], q=y[i], np=/^\d/.test(p), nq=/^\d/.test(q);
    if(np && nq){ if(+p!==+q) return +p-+q; }
    else if(np!==nq) return np ? -1 : 1;
    else if(p!==q) return p<q ? -1 : 1;
  }
  return x.length-y.length;
}
const TYPES = {lire:"say", mj:"mj", note:"mj", puce:"li", action:"action", resultat:"res"};
/* « Résultat : … » en tête du texte vaut le type Résultat, quel que soit le type choisi. */
const RES_PREFIX = /^\**\s*r[ée]sultat\s*:\s*\**\s*/i;
/* Lignes [code, titre, type, texte, coût] → scripts triés. Un code vide reprend celui du dessus. */
function buildBook(rows){
  const m=new Map(); let last="";
  for(const [c,t,ty,x,cost] of rows){
    const code=String(c??"").trim() || last; if(!code) continue; last=code;
    if(!m.has(code)) m.set(code, {code, title:"", rows:[]});
    const s=m.get(code), text=String(x??"").trim();
    if(t && !s.title) s.title=String(t).trim();
    if(!text) continue;
    const row={type:TYPES[norm(ty).split(/\s/)[0]] || "txt", text, cost:String(cost??"").trim()};
    if(RES_PREFIX.test(text)){ row.type="res"; row.text=text.replace(RES_PREFIX, ""); }
    s.rows.push(row);
  }
  return new Map([...m.entries()].sort((a,b)=>natCmp(a[0],b[0])));
}
function loadBook(){
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem(BOOK_KEY)); }catch(e){}
  if(saved && Array.isArray(saved.rows)){ BOOK=buildBook(saved.rows); bookSrc={name:saved.name, at:saved.at}; }
  else { BOOK=buildBook(BOOK_DEFAULT); bookSrc={name:null, at:null}; }
}

/* Lecture de l'Excel : la bibliothèque SheetJS n'est chargée qu'au premier import. */
function rowsFromSheet(aoa){
  const hi=aoa.findIndex(r=>r.some(c=>norm(c)==="code"));
  if(hi<0) throw new Error("colonne « Code » introuvable");
  const head=aoa[hi].map(norm), ix=["code","titre","type","texte","cout"].map(k=>head.indexOf(k));
  if(ix[3]<0) throw new Error("colonne « Texte » introuvable");
  return aoa.slice(hi+1).map(r=>ix.map(i=>i<0 ? "" : (r[i]??""))).filter(r=>r.some(v=>String(v).trim()));
}
async function readExcel(file){
  if(!window.XLSX) await new Promise((ok,ko)=>{
    const s=document.createElement("script"); s.src=XLSX_URL; s.onload=ok;
    s.onerror=()=>ko(new Error("le lecteur Excel n'a pas pu se charger (connexion internet ?)"));
    document.head.appendChild(s);
  });
  const wb=XLSX.read(await file.arrayBuffer(), {type:"array"});
  const ws=wb.Sheets["Livret"] || wb.Sheets[wb.SheetNames[0]];
  return rowsFromSheet(XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false}));
}
/* Remplace le livret par ces lignes et les garde en mémoire (elles servent aussi hors ligne). */
function useRows(rows, name, quiet){
  const book=buildBook(rows);
  if(!book.size) throw new Error("aucun script trouvé");
  BOOK=book; bookSrc={name, at:Date.now()}; ui.offline=false;
  try{ localStorage.setItem(BOOK_KEY, JSON.stringify({rows, name, at:bookSrc.at})); }catch(e){}
  const missing=EXPECTED.filter(c=>!BOOK.has(c));
  render();
  if(!quiet || missing.length) toast(`Livret chargé : ${BOOK.size} scripts.${missing.length?` Codes absents : ${missing.join(", ")}.`:""}`);
}
async function importFile(file){
  try{
    const rows=await readExcel(file);
    // Un fichier choisi à la main devient la source : plus de lien Google Sheets, même celui par défaut.
    try{ localStorage.setItem(LINK_KEY, NO_LINK); }catch(e){}
    useRows(rows, file.name);
  }catch(e){ toast(`Import impossible : ${e.message}.`); }
}

/* ---------- Google Sheets ----------
   Lien publié (Fichier → Partager → Publier sur le web) : lu en CSV.
   Lien ordinaire d'un tableau partagé « Tous les utilisateurs disposant du lien » : lu par l'export gviz, onglet « Livret ». */
/* Le tableau du livret, utilisé tant qu'on n'a pas collé un autre lien ou importé un fichier.
   En mémoire : rien = ce lien par défaut, "aucun" = pas de lien (fichier importé), sinon le lien collé. */
const DEFAULT_LINK = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQerz1a55uMvP4MkSnBh8B-MgmgLwcVESTnRGc776_PAnu_gpviGabtZYcQnxXHVQ/pubhtml";
const NO_LINK = "aucun";
const getLink = () => {
  let v=null;
  try{ v=localStorage.getItem(LINK_KEY); }catch(e){}
  return v===null || v==="" ? DEFAULT_LINK : v===NO_LINK ? "" : v;
};
function sheetCsvUrl(link){
  const u=new URL(link.trim());
  if(u.hostname!=="docs.google.com" || !u.pathname.startsWith("/spreadsheets/d/")) throw new Error("ce n'est pas un lien Google Sheets");
  const pub=u.pathname.match(/^\/spreadsheets\/d\/e\/([\w-]+)/);
  if(pub){
    const gid=u.searchParams.get("gid");
    return `https://docs.google.com/spreadsheets/d/e/${pub[1]}/pub?${gid?`gid=${gid}&single=true&`:""}output=csv`;
  }
  const id=u.pathname.match(/^\/spreadsheets\/d\/([\w-]+)/)[1];
  return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1&sheet=Livret`;
}
function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  t=t.replace(/^﻿/, "");
  for(let i=0; i<t.length; i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(f); f=""; }
    else if(c==="\n"){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(c!=="\r") f+=c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function loadFromLink(link, quiet){
  try{
    let res;
    try{ res=await fetch(sheetCsvUrl(link), {cache:"no-store"}); }
    catch(e){ throw new Error(navigator.onLine ? "le tableau n'est pas publié, ou le lien n'est pas le bon" : "pas de connexion internet"); }
    if(!res.ok) throw new Error(`Google répond ${res.status}, vérifier que le tableau est bien publié`);
    const text=await res.text();
    if(/^\s*</.test(text)) throw new Error("le tableau n'est pas publié, ou le lien n'est pas le bon");
    useRows(rowsFromSheet(parseCSV(text)), "Google Sheets", quiet);
  }catch(e){
    ui.offline=true; render();
    if(!quiet) toast(`Chargement impossible : ${e.message}.`);
  }
}
/* Chrome et Edge retiennent le fichier choisi : « Recharger » le relit sans le rechercher. */
function idb(mode, fn){
  return new Promise((ok,ko)=>{
    const r=indexedDB.open("regie-halloween", 1);
    r.onupgradeneeded=()=>r.result.createObjectStore("h");
    r.onerror=()=>ko(r.error);
    r.onsuccess=()=>{ const tx=r.result.transaction("h", mode), q=fn(tx.objectStore("h")); tx.oncomplete=()=>ok(q.result); tx.onerror=()=>ko(tx.error); };
  });
}
async function pickExcel(){
  if(!window.showOpenFilePicker){ $("book-file").click(); return; }
  try{
    const [h]=await showOpenFilePicker({types:[{description:"Livret Excel", accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"]}}]});
    fileHandle=h;
    try{ await idb("readwrite", s=>s.put(h, "livret")); }catch(e){}
    await importFile(await h.getFile());
  }catch(e){ if(e.name!=="AbortError") $("book-file").click(); }
}
async function reloadExcel(){
  try{
    if(!fileHandle) fileHandle=await idb("readonly", s=>s.get("livret"));
    if(!fileHandle){ pickExcel(); return; }
    if(await fileHandle.queryPermission({mode:"read"})!=="granted" && await fileHandle.requestPermission({mode:"read"})!=="granted") return;
    await importFile(await fileHandle.getFile());
  }catch(e){ toast(`Rechargement impossible : ${e.message}. Importer à nouveau le fichier.`); }
}

/* ================= Actions ================= */
const handlers = {
  undo(){
    if(!hist.length) return;
    S=JSON.parse(hist.pop()); save(); render(); toast("Dernière action annulée.");
  },
  askReset(){ $("confirm").hidden=false; },
  cancelReset(){ $("confirm").hidden=true; },
  reset(){
    hist.push(JSON.stringify(S));
    S=fresh(); log("Nouvelle partie."); save(); $("confirm").hidden=true; stopChrono(true); render();
  },
  phase(d){ const i=+d.i; if(i===S.phase) return; commit(()=>setPhase(i)); stopChrono(true); },
  next(){ if(S.phase<PHASES.length-1){ commit(()=>setPhase(S.phase+1)); stopChrono(true); } },
  tick(){ if(S.crans>0) commit(()=>{ spend(1); log("Le temps avance (−1 cran)."); }); },
  untick(){ const max=P().crans||0; if(S.crans<max) commit(()=>{ S.crans++; log("Un cran rendu (+1)."); }); },
  nightfall(){ commit(()=>{ S.crans=0; log("Le MJ fait tomber la nuit plus tôt."); }); },
  room(d){
    const to=d.r;
    if(P().id==="n3"){ commit(()=>{ S.liane.placed=to; log(`La liane est tendue : ${ROOMS[to].name}.`); }); return; }
    if(!isDay()) return;
    if(to===S.room) return;
    if(S.crans===0){ toast("Plus de crans : la nuit est tombée."); return; }
    let c=cost(S.room,to);
    if(c===Infinity){
      toast(to==="F" ? "La Cuisine est fermée à clé : seul Scrappy peut forcer la porte, depuis le Salon (B4)."
                     : "La cave est fermée à clé : double de la clé (établi de la Serre) ou Scrappy, depuis le Hall (A2).");
      return;
    }
    commit(()=>{
      let note="";
      if(S.joker==="move" && c>0){ c=0; S.joker=null; note=" (déplacement gratuit de Daphné)"; }
      const first=!S.visited[to];
      spend(c);
      S.room=to; S.visited[to]=true;
      log(`Le groupe va dans ${ROOMS[to].name}${c?` (${c} cran${c>1?"s":""})`:" (gratuit)"}${note}.`);
      if(first) toast(`Première visite : lire l'entrée (📖 ${to}) et poser la tuile ${to}.`);
    });
  },
  act(d){
    const a=ACT[d.id]; if(!a || S.done[a.id]) return;
    if(a.cost && S.crans===0){ toast("Plus de crans : la nuit est tombée."); return; }
    commit(()=>{
      let note="";
      if(a.cost){
        if(d.eleg && !S.caps.elegante.used){ S.caps.elegante.used=true; note=` (gratuit : ${who("elegante")}, « Un jeu d'enfant ! »)`; }
        else if(S.joker==="action"){ S.joker=null; note=" (gratuit grâce à Daphné)"; }
        else spend(a.cost);
      }
      S.done[a.id]=true;
      if(a.fact) addFact(a.fact[0], a.fact[1]);
      if(a.hint) addHint1(a.hint);
      if(a.liane && !S.liane.found) S.liane.found="D1";
      if(a.key) S.key=true;
      if(a.box){ S.box=true; S.caps.gourmand.used=false; }
      if(a.needKey) S.unlocked.H=true;
      log(`${a.el} · ${a.t}${a.cost&&!note?" (1 cran)":""}${note} → ${a.r}`);
      toast(`${a.el} → ${a.r}`);
    });
  },
  sniff(d){
    const a=ACT[d.id]; if(!a || S.caps.flaireur.used) return;
    commit(()=>{ S.caps.flaireur.used=true; log(`${who("flaireur")} renifle ${a.el} « ${a.t} » : ${a.sniff}.`); toast(`Renifler ${a.el} : ${a.sniff}.`); });
  },
  cap(d){
    const k=d.k, opt=d.o;
    if(S.caps[k].used) return;
    commit(()=>{
      if(k==="meneur"){
        S.caps[opt].used=false; S.caps.meneur.used=true;
        if(opt==="gourmand") {}
        log(`${who("meneur")} : « J'ai un plan ! » ${CAPNAME[opt]} récupère sa capacité.`);
        toast(`${CAPNAME[opt]} peut de nouveau utiliser sa capacité.`);
      }
      if(k==="elegante"){
        S.caps.elegante.used=true; S.joker=opt;
        log(`${who("elegante")} : « Un jeu d'enfant ! » ${opt==="move"?"Le prochain déplacement":"La prochaine action payante"} est gratuit${opt==="move"?"":"e"}.`);
      }
      if(k==="enquetrice"){
        S.caps.enquetrice.used=true;
        const res=loupeRes(S.room);
        if(S.room==="C") addFact(2,"Loupe");
        S.loupe={room:S.room, res};
        log(`${who("enquetrice")} : Œil de lynx dans ${ROOMS[S.room].name}. ${res}`);
        toast(`Œil de lynx : ${res}`);
      }
      if(k==="gourmand"){
        S.caps.gourmand.used=true;
        if(opt==="z1"){ S.gave.z1=true; S.hidden=true; addFact(1,"B1b"); log(`${who("gourmand")} donne un biscuit à Z1 → B1b : la pièce cachée (fait 1, fumigènes).`); toast("B1b : pièce cachée. Poser la tuile de la pièce cachée."); }
        else { S.gave.z2=true; log(`${who("gourmand")} donne un biscuit à Z2 → le grimoire (lore : minuit pile).`); toast("C1 : le grimoire. Les passages ne s'ouvrent qu'à minuit pile."); }
      }
      if(k==="costaud"){
        S.caps.costaud.used=true; S.unlocked[opt]=true;
        log(`${who("costaud")} : « En force ! » ${opt==="F"?"La porte de la Cuisine":"La porte de la cave"} cède.`);
      }
    });
  },
  cancelJoker(){ commit(()=>{ S.joker=null; S.caps.elegante.used=false; log("Joker de Daphné annulé."); }); },
  lianeGift(){ commit(()=>{ S.liane.found="Habitants"; log("« Dernière chance ! » Les Habitants passent la liane par une fenêtre du Hall."); }); },
  read(d){ openScript(d.c); },
  bookOpen(){ ui.book=true; ui.from=null; render(); },
  bookClose(){ ui.book=false; ui.from=null; render(); },
  bookGo(d){ ui.from=d.c; render(); const el=$(`sc-${d.c}`); if(el) el.scrollIntoView({block:"start"}); },
  bookRead(d){
    const c=d.c, on=!S.read[c];
    if(on && ui.from===c){ ui.from=null; if(!dock.matches) ui.book=false; }
    setRead(c, on);
  },
  bookImport(){ pickExcel(); },
  bookReload(){ const link=getLink(); if(link) loadFromLink(link); else reloadExcel(); },
  bookLink(){
    const v=$("book-url").value.trim();
    // Champ vidé : retour au tableau par défaut.
    const link=v || DEFAULT_LINK;
    try{ sheetCsvUrl(link); }catch(e){ toast(`Lien refusé : ${e.message}.`); return; }
    try{ if(link===DEFAULT_LINK) localStorage.removeItem(LINK_KEY); else localStorage.setItem(LINK_KEY, link); }catch(e){}

    loadFromLink(link);
  },
  chaseFail(d){ commit(()=>{ S.chase[d.n]++; log(`Course-poursuite ratée (essai ${S.chase[d.n]}).`); }); stopChrono(true); },
  chaseWin(d){ commit(()=>{ S.chaseOk[d.n]=true; log("Course-poursuite réussie."); }); stopChrono(false); },
  chaseRefuge(d){ commit(()=>{ S.chaseOk[d.n]=true; log("Deuxième échec : le groupe se réfugie quelque part malgré tout."); }); stopChrono(false); },
  chronoStart(){ startChrono(); },
  chronoPause(){ pauseChrono(); },
  chronoReset(){ stopChrono(true); }
};

/* ================= Chrono de la course-poursuite ================= */
const chrono={dur:60, left:60, running:false, timer:null};
function paintChrono(){
  const el=$("chrono-disp"); if(!el) return;
  const m=Math.floor(chrono.left/60), s=chrono.left%60;
  el.textContent=`${m}:${String(s).padStart(2,"0")}`;
  el.classList.toggle("low", chrono.left<=10);
  const st=$("chrono-start"); if(st) st.textContent = chrono.running ? "En cours…" : (chrono.left<chrono.dur && chrono.left>0 ? "Reprendre" : "Lancer");
}
function startChrono(){
  if(chrono.running) return;
  if(chrono.left<=0) chrono.left=chrono.dur;
  chrono.running=true;
  chrono.timer=setInterval(()=>{
    chrono.left--;
    if(chrono.left<=0){ chrono.left=0; clearInterval(chrono.timer); chrono.running=false; toast("Temps écoulé !"); }
    paintChrono();
  },1000);
  paintChrono();
}
function pauseChrono(){ clearInterval(chrono.timer); chrono.running=false; paintChrono(); }
function stopChrono(resetTime){ clearInterval(chrono.timer); chrono.running=false; if(resetTime) chrono.left=chrono.dur; paintChrono(); }

function glass(c,max,idle){
  const toks=(n,cls)=>Array.from({length:n},()=>`<span class="tok ${cls}"></span>`).join("");

    <div class="bulb bottom">${toks(idle?max:max-c,"fallen")}</div>

}

function scriptCard(s){
  const read=!!S.read[s.code], from=ui.from===s.code;
  let n=0, inOpt=false, body="";
  for(const r of s.rows){
    if(r.type==="action"){
      if(inOpt) body+="</div>";
      inOpt=true; n++;
      const cls=/gratuit/i.test(r.cost) ? "free" : /capacit/i.test(r.cost) ? "capa" : "";
      body+=`<div class="opt"><div class="opt-h"><span class="n">${n}.</span> <b>${fmt(r.text)}</b>${r.cost?` <span class="cost ${cls}">${esc(r.cost)}</span>`:""}</div>`;
    } else if(r.type==="res") body+=`<div class="res"><span class="res-l">Résultat</span><span>${fmt(r.text)}</span></div>`;
    else body+=`<p class="${r.type}">${fmt(r.text)}</p>`;
  }
  if(inOpt) body+="</div>";
  return `<article class="script ${read?"read":""} ${from?"flash":""}" id="sc-${esc(s.code)}">
    <div class="script-h">
      <span class="chip lamp">${esc(s.code)}</span><h3>${fmt(s.title||s.code)}</h3>
      <button class="btn sm ${read?"ghost":from?"lamp":""}" data-act="bookRead" data-c="${esc(s.code)}" aria-pressed="${read}">${read?"Lu ✓":from&&!dock.matches?"Lu, retour à la régie":"Marquer lu"}</button>
    </div>
    ${body}
  </article>`;
}

/* Les pièces en boutons courts : se déplacer (le jour) ou tendre la liane (nuit 3) sans déplier le manoir. */
function roomChips(){
  const n3=P().id==="n3";
  return Object.keys(ROOMS).filter(r=>n3 || r!==S.room).map(r=>{
    let meta="", cls="";
    if(n3){ if(S.liane.placed===r){ meta="liane ici"; cls="on"; } }
    else if(!accessible(r)){ meta="fermée"; cls="locked"; }
    else { const c=cost(S.room,r); meta = c===0 || S.joker==="move" ? "gratuit" : `${c} cran${c>1?"s":""}`; }
    return `<button class="go ${cls}" data-act="room" data-r="${r}"><b>${r}</b>${ROOMS[r].name}${meta?`<small>${meta}</small>`:""}</button>`;
  }).join("");
}

    else if(locked) meta="fermée à clé";
    else if(day){ const c=cost(S.room,r); meta = c===0 ? "gratuit" : S.joker==="move" ? "gratuit (Daphné)" : `${c} cran${c>1?"s":""}`; }
    else meta = vis ? "tuile posée" : "pas visitée";
    const cls=["tile", vis?"visited":"", here?"here":"", locked&&!n3?"locked":"", n3&&S.liane.placed===r?"trap":""].join(" ");

    return `<button class="${cls}" data-act="room" data-r="${r}" ${dis?"disabled":""} aria-label="${R.name}, ${meta}">

      ${tile("F")}${tile("B")}${tile("A")}${tile("C")}${tile("D")}
      <span class="lvl">−1</span>
      <span class="void"></span><span class="void"></span>${tile("H")}

            ${a.cost && flairOk ? `<button class="btn fog sm" data-act="sniff" data-id="${a.id}" title="Capacité de Scooby">Renifler</button>`:""}
            ${a.cost && elegOk ? `<button class="btn fog sm" data-act="act" data-id="${a.id}" data-eleg="1" title="Capacité de Daphné : action payante gratuite">Daphné : gratuit</button>`:""}
            <button class="btn ${a.cost?"lamp":""} sm" data-act="act" data-id="${a.id}" ${a.cost&&S.crans===0?"disabled":""}>${a.cost?(free?"Faire (gratuit)":"Faire · 1 cran"):"Noter"}</button>`}
        </span>
        <span class="r">${esc(a.r)}</span>
      </div>`;
    }).join("");
    return `<div class="el"><div class="el-head"><span class="chip lamp">${key}</span><b>${esc(name)}</b>${readBtn(key, "Lire")}</div>${rows}${extra.join("")}</div>`;
  }).join("");
  el.innerHTML = `
    <div class="panel-head"><h2>${ROOMS[r].name}</h2>${readBtn(r, `Entrée ${r}`)}</div>
    <div class="go-row"><span class="eyebrow">Aller vers</span>${roomChips()}</div>
    ${roomCaps.length?`<div class="room-caps">${roomCaps.join("")}</div>`:""}
    <span class="muted" style="font-size:.8rem">Seules les actions qui comptent sont listées. 📖 ouvre le script de l'élément dans le livret.</span>
    <div class="elements">${els}</div>`;
}

function renderCaps(){
  const r=S.room;
  const targets=CAPS.filter(x=>x.k!=="meneur" && S.caps[x.k].used);
  const paidHere=ACTIONS.some(a=>a.cost && !S.done[a.id] && ELEMENTS[r].some(([code])=>code===a.el));
  const usableHere={
    meneur: targets.length>0,
    elegante: !S.joker,
    enquetrice: true,
    gourmand: (r==="B" && !S.gave.z1) || (r==="C" && !S.gave.z2),
    flaireur: paidHere,
    costaud: (r==="B" && !S.unlocked.F) || (r==="A" && !S.unlocked.H)
  };
  const where={
    meneur: targets.length ? "Bouton en haut de la pièce." : "Aucune autre capacité utilisée pour l'instant.",
    elegante: "Boutons sur le plan (déplacement) et sur chaque action payante.",
    enquetrice: "Bouton en haut de la pièce.",
    gourmand: "Bouton sur Z1 (B1, Salon) et Z2 (C1, Bibliothèque).",
    flaireur: "Bouton « Renifler » sur les actions payantes de la pièce.",
    costaud: "Bouton sur la porte de la Cuisine (B4, Salon) et de la cave (A2, Hall)."
  };
  const cards = CAPS.map(c=>{
    const used=S.caps[c.k].used, here=!used && capOk(c.k) && usableHere[c.k];
    let btns="";
    if(!used){
      btns=`<span class="muted" style="font-size:.8rem">${where[c.k]}</span>`;
    } else {
      if(c.k==="gourmand" && !S.box) btns=`<span class="muted" style="font-size:.8rem">Rechargeable avec la boîte de la Cuisine (F1).</span>`;
      if(c.k==="enquetrice" && S.loupe) btns=`<span class="muted" style="font-size:.8rem">${ROOMS[S.loupe.room].name} : ${esc(S.loupe.res)}</span>`;
    }
    return `<div class="capc ${used?"used":""}">
      <div class="h">
        <span class="who"><span class="role">${c.role}</span><input id="name-${c.k}" data-name="${c.k}" value="${esc(S.names[c.k]||"")}" placeholder="joueur" aria-label="Joueur qui incarne ${c.role}"></span>
        <span class="pill ${used?"off":here?"here":"on"}">${used?"Utilisée":here?"Utilisable ici":"Disponible"}</span>
      </div>
      <span class="q">${c.q}</span>
      ${used?"":`<span class="rule">${c.rule}</span>`}
      ${btns?`<div class="row">${btns}</div>`:""}
    </div>`;
  }).join("");
  const left=CAPS.filter(c=>!S.caps[c.k].used).length;
  $("caps-sum").innerHTML = `<h2>Capacités</h2><span class="eyebrow">${left} sur 6 disponibles</span>`;
  $("caps").innerHTML = `
    <span class="muted" style="font-size:.8rem">Une seule fois dans toute la partie, pendant une journée, sans coût en temps.</span>
    <div class="caps">${cards}</div>`;
}

function renderInquiry(){
  const srcLabel={B1b:"B1b pièce cachée",C3:"C3 journal",H1:"H1 plan technique",Loupe:"Loupe",A3:"A3 Hall",C4:"C4 Biblio.",E2:"E2 Chambre",C2b:"C2b monte-charge"};
  const facts=[1,2,3].map(n=>{
    const got=S.facts[n].length>0;
    const part = n===1 && !got && S.hints1.length>0;
    const srcs = S.facts[n].map(s=>`<span class="chip ok">${srcLabel[s]||s}</span>`).join("")
      + (n===1 ? S.hints1.map(s=>`<span class="chip lamp">${s==="Nuit 2"?"raclement, nuit 2":srcLabel[s]||s}</span>`).join("") : "");
    const status = got ? "Trouvé" : part ? "À déduire" : "Pas encore";
    return `<div class="fact ${got?"got":part?"part":""}">
      <span class="n">${n}</span>
      <div class="txt"><b>${FACTS[n].t}</b> <span class="muted">· ${status}</span><br><span class="muted" style="font-size:.8rem">${FACTS[n].elim}</span>
      ${srcs?`<div class="srcs">${srcs}</div>`:""}</div>
    </div>`;
  }).join("");
  const all = [1,2,3].every(n=>S.facts[n].length || (n===1 && S.hints1.length));
  const lianeTxt = S.liane.found==="D1" ? "Trouvée (D1, les Habitants)" : S.liane.found==="Habitants" ? "Apportée à « Dernière chance ! »" : "Pas encore";
  const found=[1,2,3].filter(n=>S.facts[n].length).length;
  $("inquiry-sum").innerHTML = `<h2>L'enquête</h2><span class="eyebrow">${found} fait${found>1?"s":""} sur 3 · liane ${S.liane.found?"trouvée":"pas encore"}</span>`;
  $("inquiry").innerHTML = `
    <div class="facts">${facts}</div>
    ${all?`<div class="alert"><b>Les joueurs ont de quoi déduire la Chambre.</b><span class="muted">Fait 1, puis 2, puis 3 : il ne reste que la Chambre.</span></div>`:""}
    ${S.loupe&&S.loupe.room==="E"?`<span class="chip fog" style="align-self:flex-start">Bonus : la loupe confirme la Chambre</span>`:""}
    <dl class="kv">
      <dt>La liane</dt><dd><b style="color:${S.liane.found?"var(--ok)":"var(--ink)"}">${lianeTxt}</b>${S.liane.placed?` · tendue dans ${ROOMS[S.liane.placed].name}`:""}</dd>
      <dt>Double de la clé</dt><dd>${S.key?"Trouvé (D2)":"Pas trouvé"}</dd>
      <dt>Boîte de biscuits</dt><dd>${S.box?"Prise (F1)":"Dans la Cuisine"}</dd>
      <dt>Portes</dt><dd>Cuisine ${S.unlocked.F?"ouverte":"fermée"} · Cave ${S.unlocked.H?"ouverte":"fermée"}</dd>
    </dl>`;
}

function renderJournal(){
  $("journal").innerHTML = `
    <div class="panel-head"><h2>Journal</h2><span class="eyebrow">${S.log.length} entrée${S.log.length>1?"s":""}</span></div>
    ${S.log.length ? `<ul class="log">${S.log.map(l=>`<li><span class="w">${l.p}${l.c!==null?` · ${l.c}`:""}</span><span>${esc(l.t)}</span></li>`).join("")}</ul>`
      : `<p class="muted" style="margin:0">Chaque déplacement, action et capacité s'inscrit ici. « Annuler » (ou Ctrl+Z) revient en arrière.</p>`}`;
}

loadBook();
if(getLink()) loadFromLink(getLink(), true);
if(!S.log.length) log("Nuit 1 commence. Le groupe dort au Salon.");
render();
})();
</script>

</body></html>
